   otherwise a range set in January would end mid-February. */
const RANGE_DAYS   = {d8:8};
const RANGE_MONTHS = {all:null, d8:null, m1:1, m3:3, m6:6, y1:12, m18:18, m27:27};
const RANGE_LABEL  = {all:"All", d8:"8 days", m1:"1 month", m3:"3 months",
                      m6:"6 months", y1:"1 year", m18:"18 months", m27:"27 months"};
/* Backwards tops out at a year; forwards at twenty-seven months. "All" sits last
   in both: the options are an increasing scale, and no limit is the end of it
   rather than the start. */
const PAST_OPTIONS   = ["d8","m1","m3","m6","y1","all"];
const FUTURE_OPTIONS = ["d8","m1","m3","m6","y1","m18","m27","all"];
const hasRangeLimit = () => settings.pastLimit!=="all" || settings.futureLimit!=="all";
let activeTab = "all";
const TAB_TITLE = {all:"All Tasks", today:"Today", overdue:"Overdue",
                   nodue:"No Due Date", done:"Completed"};

/* Category tabs are keyed "cat:<name>" so they need no separate enum — the name
   is the identity, which also means a rename carries the tab with it. */
const isCatTab   = t => t.startsWith("cat:");
const catOfTab   = t => t.slice(4);
/* Sentinel, not a real category — nothing is ever tagged "No Category", so it
   can't collide with a user-created name and needs no entry in CATEGORIES. */
const NOCAT_TAB  = "nocat";
const isNoCatTab = t => t === NOCAT_TAB;
const tabTitle   = t => isNoCatTab(t) ? "No Category" : isCatTab(t) ? catOfTab(t) : TAB_TITLE[t];

/* Same rules as All Tasks — completed hidden unless asked for, undated placement
   honored — narrowed to one category. A category tab is a view of the list, not
   a different kind of list. */
/* A task carrying two categories appears in both pills — that's what the tag
   means, and hiding it from the second would diverge from Outlook, where
   opening the task shows both.
   Completed tasks follow the category-tab setting rather than the global "Show
   completed": "is this category finished?" is a different question from "do I
   want done items in my main list?". */
function categoryTasks(name){
  return tasks.filter(t => {
    if(!matchesFilters(t) || !t.categories.includes(name)) return false;
    if(isDone(t)) return showsCompletedIn(name);
    if(settings.noDuePlacement === "hidden" && !t.due) return false;
    return true;
  });
}

const activeInCategory = name =>
  tasks.filter(t => !isDone(t) && t.categories.includes(name)).length;
/* Each category answers only for itself. */
const showsCompletedIn = name => settings.categoriesShowingCompleted.includes(name);
function setShowsCompletedIn(name, shows){
  const list = settings.categoriesShowingCompleted;
  const i = list.indexOf(name);
  if(shows && i < 0) list.push(name);
  if(!shows && i >= 0) list.splice(i, 1);
}
/* Keyed by name, so both have to follow the category. */
function renameCompletedFlag(oldName, newName){
  if(showsCompletedIn(oldName)){ setShowsCompletedIn(oldName, false); setShowsCompletedIn(newName, true) }
}
const clearCompletedFlag = name => setShowsCompletedIn(name, false);

const completedInCategory = name =>
  tasks.filter(t => isDone(t) && t.categories.includes(name)).length;

/* Completed tasks the current main tab would show. All Tasks counts everything
   in range; Today counts only what was completed today, so its banner is
   usually absent. */
function completedForMainTab(){
  return tasks.filter(t => {
    if(!isDone(t) || !withinDateRange(t)) return false;
    if(activeTab === "today"){
      const c = t.completed || t.due;
      return !!c && sameDay(new Date(c), new Date());
    }
    if(isNoCatTab(activeTab)) return t.categories.length === 0 && matchesFilters(t);
    // Completed tasks that never had a due date — the only ones this tab could
    // reveal.
    if(activeTab === "nodue") return !t.due && matchesFilters(t);
    return matchesFilters(t);
  }).length;
}

/* Visible when it has active tasks, or has completed tasks and the category tab
   is showing those. */
const categoryEarnsPill = name =>
  isAlwaysShown("cat:" + name) ||
  activeInCategory(name) > 0 ||
  (showsCompletedIn(name) && completedInCategory(name) > 0);

/* Tasks carrying no category at all. Same rules as All Tasks — completed hidden
   unless asked for, undated placement honored — narrowed to the untagged. */
function noCategoryTasks(){
  return visible(NOCAT_TAB).filter(t => t.categories.length === 0);
}

/* Visibility ignores search and category filters, like the Overdue and No Due
   Date pills: a tab shouldn't blink out mid-keystroke. */
const hasNoCategoryTasks = () => tasks.some(t => t.categories.length === 0 && !isDone(t));
const PLACEMENT = {
  top:    {label:"Top of list",    note:"Undated tasks appear above Overdue, so they're the first thing you see."},
  bottom: {label:"Bottom of list", note:"Undated tasks sit below everything with a date, above Completed."},
  hidden: {label:"Don't show",     note:"Undated tasks stay in your mailbox and keep syncing — they're just not listed here."}
};


/* ================= RECURRENCE ================= */
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYFULL={Sun:"Sunday",Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday",Sat:"Saturday"};
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const ORDINALS=["First","Second","Third","Fourth","Last"];
const UNIT={Daily:"day",Weekly:"week",Monthly:"month",Yearly:"year"};
const ABBR={Daily:"d",Weekly:"w",Monthly:"mo",Yearly:"y"};

function recSummary(r){
  if(!r) return "Never";
  let base;
  if(r.regen){
    const n=r.interval||1, u=UNIT[r.freq];
    base = n===1 ? `A ${u} after completion` : `${n} ${u}s after completion`;
  } else if(r.freq==="Daily"){
    base = r.interval===1?"Every day":`Every ${r.interval} days`;
  } else if(r.freq==="Weekly"){
    const names=DAYS.filter(d=>(r.days||[]).includes(d)).join(", ");
    const every=r.interval===1?"Every week":`Every ${r.interval} weeks`;
    base = names?`${every} on ${names}`:every;
  } else if(r.freq==="Monthly"){
    const every=r.interval===1?"month":`${r.interval} months`;
    base = r.mode==="weekday"
      ? `The ${r.ordinal.toLowerCase()} ${DAYFULL[r.weekday]} of every ${every}`
      : `Day ${r.dayOfMonth} of every ${every}`;
  } else {
    base = r.mode==="weekday"
      ? `The ${r.ordinal.toLowerCase()} ${DAYFULL[r.weekday]} of ${MONTHS[r.month-1]}`
      : `Every ${MONTHS[r.month-1]} ${r.dayOfMonth}`;
  }
  const e=r.end||{mode:"never"};
  if(e.mode==="after") return `${base}, ${e.count} times`;
  if(e.mode==="on") return `${base}, until ${new Date(e.date).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}`;
  return base;
}

function recShort(r){
  if(!r) return "";
  if(r.regen) return `${r.interval||1}${ABBR[r.freq]} after done`;
  if(r.freq==="Daily") return r.interval===1?"Daily":`Every ${r.interval}d`;
  if(r.freq==="Weekly"){
    const names=DAYS.filter(d=>(r.days||[]).includes(d)).join(" ");
    const head=r.interval===1?"Weekly":`Every ${r.interval}w`;
    return names?`${head} · ${names}`:head;
  }
  if(r.freq==="Monthly"){
    const head=r.interval===1?"Monthly":`Every ${r.interval}mo`;
    return r.mode==="weekday"
      ? `${head} · ${r.ordinal.toLowerCase()} ${r.weekday}`
      : `${head} · day ${r.dayOfMonth}`;
  }
  return r.mode==="weekday"
    ? `Yearly · ${r.ordinal.toLowerCase()} ${r.weekday} of ${MONTHS[r.month-1].slice(0,3)}`
    : `Yearly · ${MONTHS[r.month-1].slice(0,3)} ${r.dayOfMonth}`;
}

/* Clamp day-of-month: "day 31" lands on Feb 28, not Mar 3. */
function setDayClamped(base,day){
  const x=new Date(base);
  const len=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();
  x.setDate(Math.min(Math.max(1,day),len));
  return x;
}
function nthWeekdayOf(year,month,ordinal,weekdayName){
  const target=DAYS.indexOf(weekdayName);
  const matches=[];
  const last=new Date(year,month+1,0).getDate();
  for(let d=1;d<=last;d++){
    const x=new Date(year,month,d);
    if(x.getDay()===target) matches.push(x);
  }
  if(!matches.length) return null;
  if(ordinal==="Last") return matches[matches.length-1];
  return matches[Math.min(ORDINALS.indexOf(ordinal),matches.length-1)];
}
function keepTime(src,target){
  const x=new Date(target);
  x.setHours(src.getHours(),src.getMinutes(),0,0);
  return x;
}

function advance(ref,r){
  const from=new Date(ref);
  const n=Math.max(1,r.interval||1);
  if(r.regen){
    const x=new Date(from);
    if(r.freq==="Daily")x.setDate(x.getDate()+n);
    else if(r.freq==="Weekly")x.setDate(x.getDate()+7*n);
    else if(r.freq==="Monthly")x.setMonth(x.getMonth()+n);
    else x.setFullYear(x.getFullYear()+n);
    return x;
  }
  if(r.freq==="Daily"){const x=new Date(from);x.setDate(x.getDate()+n);return x}
  if(r.freq==="Weekly"){
    const wanted=(r.days&&r.days.length?r.days:[DAYS[from.getDay()]]).map(d=>DAYS.indexOf(d));
    for(let o=1;o<=6;o++){
      const c=new Date(from);c.setDate(c.getDate()+o);
      if(c.getDay()<from.getDay()) break;           // crossed into next week
      if(wanted.includes(c.getDay())) return c;
    }
    const jumped=new Date(from);jumped.setDate(jumped.getDate()+7*n);
    const weekStart=new Date(jumped);weekStart.setDate(weekStart.getDate()-weekStart.getDay());
    for(let o=0;o<=6;o++){
      const c=new Date(weekStart);c.setDate(c.getDate()+o);
      if(wanted.includes(c.getDay())) return keepTime(from,c);
    }
    return null;
  }
  if(r.freq==="Monthly"){
    const base=new Date(from);base.setDate(1);base.setMonth(base.getMonth()+n);
    if(r.mode==="weekday"){
      const x=nthWeekdayOf(base.getFullYear(),base.getMonth(),r.ordinal,r.weekday);
      return x?keepTime(from,x):null;
    }
    return keepTime(from,setDayClamped(base,r.dayOfMonth));
  }
  // Yearly
  const base=new Date(from);base.setDate(1);base.setFullYear(base.getFullYear()+1);base.setMonth((r.month||1)-1);
  if(r.mode==="weekday"){
    const x=nthWeekdayOf(base.getFullYear(),base.getMonth(),r.ordinal,r.weekday);
    return x?keepTime(from,x):null;
  }
  return keepTime(from,setDayClamped(base,r.dayOfMonth));
}

function withinRange(candidate,r){
  const e=r.end||{mode:"never"};
  if(e.mode==="never") return true;
  if(e.mode==="on"){ const end=new Date(e.date); end.setHours(23,59,59); return candidate<=end }
  if(e.mode==="after"){
    if((e.count||0)<2) return false;
    let cursor=new Date(r.start||candidate);
    for(let i=1;i<e.count;i++){
      const next=advance(cursor,r);
      if(!next) return false;
      if(next.toDateString()===candidate.toDateString()) return true;
      if(next>candidate) return false;
      cursor=next;
    }
    return false;
  }
  return true;
}
function nextDate(ref,r){
  const c=advance(ref,r);
  if(!c) return null;
  return withinRange(c,r)?c:null;
}
function upcoming(ref,r,count){
  const out=[]; let cur=new Date(ref);
  for(let i=0;i<count;i++){ const nx=nextDate(cur,r); if(!nx)break; out.push(nx); cur=nx }
  return out;
}

/* Completing a recurring task closes this one and opens the next. */
function completeRecurring(t){
  const r=t.rec;
  t.status="Completed"; t.pct=100; t.completed=new Date(); t.rec=null;
  const ref = r.regen ? new Date() : (t.due||new Date());
  const nd = nextDate(ref,r);
  if(!nd) return null;
  // bodyType travels with the note, or a recurring HTML note would come back
  // plain and show its own markup as text.
  return {id:nextId++,subject:t.subject,notes:t.notes,bodyType:t.bodyType,
    categories:[...t.categories],
    importance:t.importance,due:nd,status:"NotStarted",pct:0,rec:r,
    totalWork:t.totalWork,billing:t.billing,reminder:t.reminder,dirty:true};
}

/* ---------- Status / percent coupling, mirroring TPTask.swift ---------- */
function setStatus(t,s){
  t.status=s;
  if(s==="Completed"){t.pct=100;t.completed=t.completed||new Date()}
  else if(s==="NotStarted"){t.pct=0;t.completed=null}
  else {if(t.pct>=100)t.pct=99;t.completed=null}
}
function setPct(t,v){
  t.pct=Math.max(0,Math.min(100,v));
  if(t.pct>=100){t.status="Completed";t.completed=t.completed||new Date()}
  else if(t.pct===0&&t.status==="InProgress"){t.status="NotStarted";t.completed=null}
  else if(t.status==="Completed"){t.status="InProgress";t.completed=null}
}
const isDone = t => t.status==="Completed";
const isOverdue = t => !isDone(t) && t.due && t.due < new Date() && !sameDay(t.due,new Date());
const sameDay=(a,b)=>a.toDateString()===b.toDateString();

/* Abbreviated weekday, full month, day, year — "Thu, August 20, 2026".
   Always explicit, never "Today"/"Tomorrow": the section heading already says
   which day it is, and in the Overdue tab a relative label would be unhelpful. */
const rowDateFmt = new Intl.DateTimeFormat(undefined,
  {weekday:"short", month:"long", day:"numeric", year:"numeric"});
function fmt(dt){ return rowDateFmt.format(new Date(dt)) }

/* ---------- Grouping ----------
   Today and Tomorrow are named; every day beyond that gets its own dated
   section, so the list reads as a schedule rather than a pile. Overdue stays
   one group — anything late needs attention now, and which day it slipped is
   detail the row already carries. */
const dayKeyFmt = new Intl.DateTimeFormat(undefined,{weekday:"short",month:"long",day:"numeric",year:"numeric"});

function groupOf(t){
  if(isDone(t)) return {kind:"completed",title:"Completed",rank:6,when:8.64e15};
  if(!t.due)    return {kind:"nodate",title:"No Due Date",
                        rank: settings.noDuePlacement==="top"?0:5, when:8.64e15};
  const n=new Date(), tm=new Date(n); tm.setDate(tm.getDate()+1);
  if(sameDay(t.due,n))  return {kind:"today",title:"Today",rank:2,when:-8.64e15};
  if(sameDay(t.due,tm)) return {kind:"tomorrow",title:"Tomorrow",rank:3,when:-8.64e15};
  if(t.due<n)           return {kind:"overdue",title:"Overdue",rank:1,when:-8.64e15};
  const midnight = new Date(t.due.getFullYear(),t.due.getMonth(),t.due.getDate());
  return {kind:"day",title:dayKeyFmt.format(midnight),rank:4,when:+midnight};
}
/* Horizon grouping. Overdue, Today and Tomorrow are decided exactly as groupOf
   decides them, so the first sections behave identically under both groupings
   and the No Due Date placement setting needs no special case. Past tomorrow the
   resolution coarsens: the rest of this week, four whole Sunday–Saturday weeks,
   then whole months.

   Weeks start after the current one rather than four weeks from today, so the
   headings are stable calendar blocks rather than a window that renames itself
   every morning. */
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const startOfWeek = d => { const x = startOfDay(d); x.setDate(x.getDate() - x.getDay()); return x };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };

const weekTitleFmt = new Intl.DateTimeFormat(undefined,{month:"short",day:"numeric"});
const monthTitleFmt = new Intl.DateTimeFormat(undefined,{month:"long",year:"numeric"});

function weekTitle(start){
  const end = addDays(start, 6);
  const sameMonth = start.getMonth() === end.getMonth();
  return sameMonth
    ? `${weekTitleFmt.format(start)}–${end.getDate()}`
    : `${weekTitleFmt.format(start)} – ${weekTitleFmt.format(end)}`;
}

function horizonGroupOf(t){
  if(isDone(t)) return {kind:"completed",title:"Completed",rank:6,when:8.64e15};
  if(!t.due)    return {kind:"nodate",title:"No Due Date",
                        rank: settings.noDuePlacement==="top"?0:5, when:8.64e15};
  const now = new Date(), tm = addDays(now, 1);
  if(sameDay(t.due, now)) return {kind:"today",title:"Today",rank:2,when:-8.64e15};
  if(sameDay(t.due, tm))  return {kind:"tomorrow",title:"Tomorrow",rank:3,when:-8.64e15};
  if(t.due < now)         return {kind:"overdue",title:"Overdue",rank:1,when:-8.64e15};

  const due = startOfDay(t.due);
  const thisWeekEnd = addDays(startOfWeek(now), 7);
  /* Tomorrow can fall in *next* week — on a Saturday it does — so that carve-out
     happens above, before this test. Whatever is still inside this week goes
     here, which is legitimately empty on a Saturday: an empty section is simply
     never built. */
  if(due < thisWeekEnd) return {kind:"restweek",title:"Rest of This Week",rank:4,when:+thisWeekEnd};

  const firstWeek = thisWeekEnd;
  for(let i = 0; i < 4; i++){
    const start = addDays(firstWeek, i*7), end = addDays(start, 7);
    if(due >= start && due < end) return {kind:"week",title:weekTitle(start),rank:4,when:+start};
  }

  /* Past the weeks: whole months, except the first — four weeks out lands
     mid-month, so that section holds only the tail of it. "Rest of September",
     because plain "September" would be a lie with three of its weeks above. */
  const weeksEnd = addDays(firstWeek, 28);
  const monthOfEnd = new Date(weeksEnd.getFullYear(), weeksEnd.getMonth(), 1);
  const nextMonth = new Date(weeksEnd.getFullYear(), weeksEnd.getMonth()+1, 1);
  if(due < nextMonth) return {kind:"restmonth",title:"Rest of "+monthTitleFmt.format(monthOfEnd),
                              rank:4,when:+monthOfEnd};
  const m = new Date(due.getFullYear(), due.getMonth(), 1);
  return {kind:"month",title:monthTitleFmt.format(m),rank:4,when:+m};
}

const undatedCount = () => tasks.filter(t=>!t.due && !isDone(t)).length;

/* The same count narrowed to one category. A banner showing the global figure
   on a category tab would point at tasks that aren't in it. */
const undatedCountIn = name =>
  tasks.filter(t=>!t.due && !isDone(t) && t.categories.includes(name)).length;

/* Only the tabs that actually apply the setting get a banner. Today and Overdue
   exclude undated tasks by definition, No Due Date deliberately ignores the
   setting, and Completed isn't affected — a banner on any of those would explain
   a rule that isn't in force there. */
function hiddenUndatedCount(){
  if(settings.noDuePlacement !== "hidden") return 0;
  if(activeTab === "all") return undatedCount();
  if(isCatTab(activeTab)) return undatedCountIn(catOfTab(activeTab));
  return 0;
}
function groupKey(g){ return g.rank+"|"+g.when }
/* Anchored on the completion date when there is one, otherwise the due date — a
   task finished yesterday shouldn't vanish because it was *due* two years ago.
   Undated tasks have no anchor and always pass; the No Due Date placement
   setting governs those instead. */
/* The window edge for a limit, or null for no limit. */
function rangeBoundary(limit, sign){
  if(limit === "all") return null;
  const x = new Date();
  const days = RANGE_DAYS[limit];
  if(days != null) x.setDate(x.getDate() + sign * days);
  else x.setMonth(x.getMonth() + sign * RANGE_MONTHS[limit]);
  return x;
}

function withinDateRange(t){
  const anchor = t.completed || t.due;
  if(!anchor) return true;
  const a = new Date(anchor);
  // Both edges snap to whole days, or the window is lopsided: an exact
  // timestamp on the far edge would hide a task due at 5pm on the last day
  // while showing its counterpart 8 days back.
  const earliest = rangeBoundary(settings.pastLimit, -1);
  if(earliest){ earliest.setHours(0,0,0,0); if(a < earliest) return false }
  const latest = rangeBoundary(settings.futureLimit, 1);
  if(latest){ latest.setHours(23,59,59,999); if(a > latest) return false }
  return true;
}

const outOfRangeCount = () => hasRangeLimit()
  ? tasks.filter(t=>!withinDateRange(t)).length : 0;

/* Search and category filters only — the parts that apply on every tab. */
function matchesFilters(t){
  // The window applies everywhere, so it lives here rather than in each tab.
  if(!withinDateRange(t)) return false;
  if(filter.size && !t.categories.some(c=>filter.has(c))) return false;
  // bodyText, not the raw note: searching an HTML body for "li" shouldn't match
  // every bulleted list.
  if(query && !searchHaystack(t).includes(query.toLowerCase())) return false;
  return true;
}

/* The tab is a parameter, never read from `activeTab`.
   Badges compute every tab at once, so a function that consulted the tab you
   happen to be standing in gave every other tab that tab's answer — which is
   why turning completed on in All Tasks pushed the No Category badge up, and
   why it fell again the moment you navigated away. */
function visible(forTab){
  const tab = forTab || "all";
  return tasks.filter(t=>{
    if(!matchesFilters(t)) return false;
    if(isDone(t) && !showsCompletedInTab(tab)) return false;
    if(settings.noDuePlacement==="hidden" && !t.due && !isDone(t)) return false;
    return true;
  });
}

/* Today tab: overdue first, then today. Never completed, never undated — the
   display preferences for those govern All Tasks, where they're a matter of
   taste. Here they'd contradict what the tab means. */
function todayTasks(){
  return tasks.filter(t=>{
    if(!matchesFilters(t)) return false;
    // Completed tasks appear only when asked for, and only if they were
    // completed today — a task finished last week isn't a today task, however
    // it was scheduled.
    if(isDone(t)){
      if(!showsCompletedInTab("today")) return false;
      const c = t.completed || t.due;
      return !!c && sameDay(new Date(c), new Date());
    }
    const k = groupOf(t).kind;
    return k==="overdue" || k==="today";
  });
}

function overdueTasks(){
  return tasks.filter(t => matchesFilters(t) && !isDone(t) && groupOf(t).kind==="overdue");
}

/* Deliberately ignores search and category filters. Tab *visibility* keys off
   this rather than overdueTasks(), so the pill doesn't vanish mid-keystroke when
   a search happens to exclude everything late — it stays, its badge reads 0, and
   the empty state explains why. */
const hasOverdueTasks = () => tasks.some(t => !isDone(t) && groupOf(t).kind==="overdue");

/* Deliberately ignores the "Don't show" display preference: that setting governs
   All Tasks, where undated work is a matter of taste. A tab whose entire job is
   showing undated tasks can't honor a preference to hide them. */
function undatedTasks(){
  return tasks.filter(t => {
    if(!matchesFilters(t) || t.due) return false;
    // Completed undated tasks appear only when this tab asks for them. Without
    // this the tab had nothing to reveal and so carried no banner.
    if(isDone(t)) return showsCompletedInTab("nodue");
    return true;
  });
}

/* Newest completion first — the useful order for an archive is "what did I just
   do", not "what was due when". Tasks closed elsewhere without a stamped
   completion date sort to the bottom rather than pretending to be ancient.
   Ignores the "Show completed" preference: that governs All Tasks, and a tab
   whose job is showing completed work can't honor a preference to hide it. */
function completedTasks(){
  return tasks.filter(t => matchesFilters(t) && isDone(t)).sort((a,b)=>{
    if(a.completed && b.completed && +a.completed !== +b.completed) return b.completed - a.completed;
    if(a.completed && !b.completed) return -1;
    if(!a.completed && b.completed) return 1;
    return az(a,b);
  });
}

/* Same reasoning as hasOverdueTasks: ignores search and category filters so the
   pill doesn't blink out mid-keystroke. */
const hasUndatedTasks = () => tasks.some(t => !isDone(t) && !t.due);

/* Overdue and No Due Date only earn a pill when they'd have something in them.
   All Tasks and Today are always meaningful. */
const availableTabs = () => ["all","today","overdue","nodue","done"].filter(t =>
  t==="overdue" ? (isAlwaysShown(t) || hasOverdueTasks()) :
  t==="nodue"   ? (isAlwaysShown(t) || hasUndatedTasks()) : true
)
 // Sits with the fixed tabs rather than at the end of the categories: it isn't
 // a category, it's the absence of one. Only when something is actually
 // untagged.
 .concat((hasNoCategoryTasks() || isAlwaysShown(NOCAT_TAB)) ? [NOCAT_TAB] : [])
// A pill you're standing in keeps its place even when it stops earning one, so
// completing the last task in a category doesn't yank the tab out from under
// you. It goes on the next tab you select.
.concat(orderedCategories()
  .filter(c => categoryEarnsPill(c.name) || activeTab === "cat:" + c.name)
  .map(c => "cat:" + c.name));

/* activeTab is what survives: clear the last overdue task while standing in that
   tab and the pill disappears underneath you, so fall back rather than stranding
   the user on a tab that no longer exists. */
const effectiveTab = () => availableTabs().includes(activeTab) ? activeTab : "all";

const allTabCount   = () => visible("all").length;
/* Counts what the Today tab actually lists, completed included when that tab
   asks for them — otherwise its badge never moved while its list did. */
const todayTabCount = () => todayTasks().length;
/* Work still to do: overdue plus due today, never completed.
   Drives both the line under the logo and the app icon badge. It deliberately
   differs from the Today tab's badge, which counts what the tab *lists* — so
   revealing completed tasks raises the badge but not this, because finishing
   something shouldn't make the app look busier. */
const todayOutstanding = () => tasks.filter(t=>{
  if(!matchesFilters(t) || isDone(t)) return false;
  const k = groupOf(t).kind;
  return k==="today" || k==="overdue";
}).length;
const tabCount = tab => isNoCatTab(tab) ? noCategoryTasks().length
                    : isCatTab(tab) ? categoryTasks(catOfTab(tab)).length
                    : tab==="all" ? allTabCount()
                    : tab==="today" ? todayTabCount()
                    : tab==="overdue" ? overdueTasks().length
                    : tab==="nodue" ? undatedTasks().length
                    : completedTasks().length;
const az = (a,b)=>a.subject.localeCompare(b.subject, undefined, {sensitivity:"base"});
function dueThenAz(a,b){
  if(a.due && b.due && +a.due!==+b.due) return a.due-b.due;
  if(a.due && !b.due) return -1;
  if(!a.due && b.due) return 1;
  return az(a,b);
}

/* ---------- Notes body ----------
   Exchange stores a task body as plain text or HTML, chosen per task by its
   BodyType — so this is a property of the note, not an app-wide preference.
   Notes written in Outlook arrive as HTML whether or not we ever ask for it,
   so rendering it is not optional; the toggle governs what we create. */

const isHtmlBody = t => t && t.bodyType === "HTML";

/* Strip tags for anything that needs the words rather than the markup: search,
   the row preview, the character count. Without this, searching for "li" would
   match every bulleted note. */
function bodyText(t){
  const raw = t && t.notes ? String(t.notes) : "";
  if(!isHtmlBody(t)) return raw;
  return raw
    // A nested list opens before its parent <li> closes, so break the line
    // first or the sub-item runs on to the end of the one above it.
    .replace(/<(ul|ol)[^>]*>/gi, "\n")
    .replace(/<li[^>]*>/gi, "• ")
    .replace(/<\/(p|div|li|h[1-6]|ul|ol)>/gi, "\n")
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<[^>]+>/g, "")
    // Decode last, and numerically too — Outlook emits plenty of &ndash;,
    // &rsquo; and friends that would otherwise show as literal text.
    .replace(/&nbsp;/gi, " ")
    .replace(/&(ndash|mdash);/gi, "—")
    .replace(/&(lsquo|rsquo|apos|#39);/gi, "'")
    .replace(/&(ldquo|rdquo|quot);/gi, '"')
    .replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n))
    .replace(/&lt;/gi, "<").replace(/&gt;/gi, ">")
    .replace(/&amp;/gi, "&")
    .replace(/[ \t]+\n/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

/* Turn a plain note into HTML when switching on — safe, nothing is lost. */
function plainToHtml(text){
  const esc2 = String(text || "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  if(!esc2.trim()) return "";
  return esc2.split(/\n{2,}/).map(par =>
    "<p>" + par.split("\n").join("<br>") + "</p>").join("");
}

/* ---------- Render ---------- */
const el = id => document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function spine(cats){
  if(!cats.length) return '<span class="spine empty"></span>';
  return '<span class="spine">'+cats.map(c=>{
    const col=catColor(c);
    return `<i style="background:${col||'#E3E5E9'}"></i>`;
  }).join("")+'</span>';
}

function renderList(){
  document.querySelector(".device").style.setProperty("--subjlines", settings.subjectLines);
  // Overdue plus due today, never completed — the same number the app icon
  // shows. It tracks the Today badge until you reveal completed tasks there,
  // at which point the badge counts them and this doesn't.
  const dueToday = todayOutstanding();
  const pend = changeQueue.length;
  el("syncBtn").textContent = pend ? `↻${pend}` : "↻";
  el("syncBtn").title = pend ? `Sync ${pend} queued change${pend===1?"":"s"}` : "Sync now";
  el("syncBtn").style.opacity = isOffline ? "0.45" : "1";

  // Connectivity outranks the due-today count: "3 due today" while silently
  // offline is a worse lie than a missing count.
  if(isOffline){
    el("navsub").className = "off";
    el("navsub").textContent = pend ? `⚠ Offline · ${pend} waiting` : "⚠ Offline";
  } else if(pend){
    el("navsub").className = "";
    el("navsub").textContent = `${pend} change${pend===1?"":"s"} to sync`;
  } else {
    el("navsub").className = "";
    el("navsub").textContent = dueToday
      ? `${dueToday} task${dueToday===1?"":"s"} due`
      : "Updated "+lastSynced.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
  }
  const here = effectiveTab();
  el("tabName").textContent = tabTitle(here);
  // Names the tab rather than saying "tasks": search is scoped to whatever tab
  // you're standing in, and a generic placeholder led testers to expect it
  // searched everything.
  el("search").placeholder = "Search " + tabTitle(here);
  el("filterBtn").className = filter.size?"filter-on":"";
  el("filterBtn").textContent = filter.size?"☰•":"☰";

  renderTabs();
  activeTab = effectiveTab();
  const vis = isNoCatTab(activeTab) ? noCategoryTasks()
            : isCatTab(activeTab) ? categoryTasks(catOfTab(activeTab))
            : activeTab==="all" ? visible("all")
            : activeTab==="today" ? todayTasks()
            : activeTab==="overdue" ? overdueTasks()
            : activeTab==="nodue" ? undatedTasks()
            : completedTasks();
  const list = el("list");
  if(!vis.length){
    let h3="All clear", p="Nothing is due. Add a task and it syncs to Outlook.";
    if(query){h3=`No matches for "${esc(query)}"`;
      p='Tap the ✕ in the search box to see everything again.'}
    else if(filter.size){h3="Nothing in these categories";p="Clear the filter to see the rest of your tasks."}
    else if(activeTab==="today"){h3="Nothing due today";
      p="No overdue tasks and nothing due today. Check All Tasks for what's coming."}
    else if(activeTab==="overdue"){h3="Nothing overdue";
      p="You're caught up. Nothing is past its due date."}
    else if(activeTab==="nodue"){h3="Nothing undated";
      p="Every task has a due date."}
    else if(activeTab==="done"){h3="Nothing completed yet";
      p="Finished tasks collect here, newest first."}
    else if(isNoCatTab(activeTab)){h3="Nothing uncategorized";
      p="Every task has a category."}
    else if(isCatTab(activeTab)){h3=`Nothing in ${catOfTab(activeTab)}`;
      p="Tag a task with this category and it shows up here."}
    list.innerHTML=`<div class="empty"><h3>${h3}</h3><p>${p}</p>
      <button id="emptyAdd" class="btn-primary" style="width:auto;padding:0 20px;min-height:40px;margin-top:6px">Add a task</button></div>`;
    return;
  }
  // Build sections dynamically — one per distinct day beyond tomorrow.
  //
  // The Overdue tab breaks the single Overdue bucket back apart into one section
  // per due date, oldest first, A–Z inside each. In the other tabs "how late" is
  // noise; here it's the entire organizing idea.
  const buckets = new Map();
  for(const t of vis){
    const mainTab = activeTab === "all" || activeTab === "today";
    // Each of the two now carries its own grouping.
    const mainGrouping = activeTab === "today" ? settings.todayGrouping : settings.mainGrouping;
    let g, k;

    /* Grouping by assignee answers "what does this person owe me", so every
       task files under a name — including overdue and undated ones, which every
       other grouping pins into their own sections. Pinning them here would put
       the most urgent assigned work somewhere other than under the person
       responsible for it. They keep their red date and warning icon inside the
       section. */
    const assignedHere = isAssignedGrouping(
      isNoCatTab(activeTab) ? settings.ncGrouping
      : isCatTab(activeTab) ? settings.catGrouping
      : activeTab === "nodue"   ? settings.ndGrouping
      : activeTab === "done"    ? settings.cpGrouping
      : activeTab === "overdue" ? settings.odGrouping
      : activeTab === "today"   ? settings.todayGrouping
      : settings.mainGrouping);

    if(assignedHere){
      const who = assigneeOf(t);
      g = assignedSection(who, assignedHere === "assignedZA");
      if(activeTab === "overdue") g.urgent = true;
      k = "ag:" + who;
    } else if(isNoCatTab(activeTab) && settings.ncGrouping !== "dueDate"){
      // Overdue and undated stay pinned, as they do in the main tabs.
      const ag0 = null;
      const kind = groupOf(t).kind;
      if(kind === "overdue"){ g = {kind:"overdue",title:"Overdue",rank:1,when:0,urgent:true}; k="od" }
      else if(!t.due && !isDone(t)){
        g = {kind:"nodate", title:"No Due Date",
             rank: settings.noDuePlacement==="top" ? 0 : 5, when:0}; k="nd";
      }
      else if(ag0){ const who = assigneeOf(t); g = assignedSection(who, ag0 === "assignedZA"); k = "ag:" + who }
      else { g = {kind:"body", title:"Tasks", rank:3, when:0}; k="body" }
    } else if(mainTab && mainGrouping !== "dueDate" && mainGrouping !== "horizon"){
      /* Horizon must be excluded here, not just handled further down: this
         branch catches every grouping that isn't dueDate and sends anything it
         doesn't recognize to the single "Tasks" body section — which is exactly
         what horizon looked like on screen, one flat list with no headings. The
         branch that handles it sits lower in this chain and was unreachable. */
      // Overdue and undated stay pinned, out of the partition — otherwise a
      // late task would hide inside a category section.
      const kind = groupOf(t).kind;
      if(kind === "overdue"){ g = {kind:"overdue",title:"Overdue",rank:1,when:0,urgent:true}; k="od" }
      else if(!t.due && !isDone(t)){
        g = {kind:"nodate", title:"No Due Date",
             rank: settings.noDuePlacement==="top" ? 0 : 5, when:0}; k="nd";
      }
      else if(mainGrouping === "category"){
        // Files under its FIRST tag. A partition, not a filter: a task with two
        // categories appears once, or the section counts would exceed the total.
        const home = homeCategory(t) || "";
        const order = orderedCategories().map(c => c.name);
        const idx = order.indexOf(home);
        g = { kind:"catgroup", title: home || "No Category", rank:3,
              when: home === "" ? Infinity : (idx < 0 ? 1e6 : idx) };
        k = "cg:" + home;
      }
      else if(mainGrouping === "assignedAZ" || mainGrouping === "assignedZA"){
        // Names have no defined order the way categories do, so alphabetical is
        // the only sensible arrangement. Unassigned sinks in both directions.
        const who = assigneeOf(t);
        g = assignedSection(who, mainGrouping === "assignedZA");
        k = "ag:" + who;
      }
      else { g = {kind:"body", title:"Tasks", rank:3, when:0}; k="body" }
    } else if(isCatTab(activeTab) && settings.catGrouping === "horizon"){
      // Same trap as All Tasks: the branch below catches everything that isn't
      // dueDate, so horizon has to be taken first or it lands in the one-list
      // fallback and the headings vanish.
      g = horizonGroupOf(t); k = g.kind + "|" + g.when;
    } else if(isCatTab(activeTab) && settings.catGrouping !== "dueDate"){
      // Three buckets at most: late, undated, everything else. "Ungrouped" can
      // still yield three sections, which is why it isn't called "None".
      const kind = groupOf(t).kind;
      if(kind === "overdue"){ g = {kind:"overdue",title:"Overdue",rank:1,when:0,urgent:true}; k="od" }
      else if(!t.due && !isDone(t)){
        g = {kind:"nodate", title:"No Due Date",
             rank: settings.noDuePlacement==="top" ? 0 : 5, when:0}; k="nd";
      }
      else if(isAssignedGrouping(settings.catGrouping)){
        const who = assigneeOf(t);
        g = assignedSection(who, settings.catGrouping === "assignedZA"); k = "ag:" + who;
      }
      else { g = {kind:"body", title:"Tasks", rank:3, when:0}; k="body" }
    } else if(activeTab==="nodue"){
      if(settings.ndGrouping === "category"){
        const home = homeCategory(t) || "";
        const order = orderedCategories().map(c => c.name);
        const idx = order.indexOf(home);
        g = { kind:"catgroup", title: home || "No Category", rank:0,
              when: home === "" ? Infinity : (idx < 0 ? 1e6 : idx) };
        k = "ndcg:" + home;
      } else if(isAssignedGrouping(settings.ndGrouping)){
        const who = assigneeOf(t);
        g = assignedSection(who, settings.ndGrouping === "assignedZA"); k = "ag:" + who;
      } else {
        g = {kind:"nodate", title:"No Due Date", rank:0, when:0};
        k = "nodue";
      }
    } else if(activeTab==="done"){
      if(settings.cpGrouping === "completionDate"){
        // Exchange doesn't always record a completion date — those get their
        // own section at the bottom rather than being dropped or guessed at.
        if(!t.completed){ g = {kind:"nodone", title:"No Completion Date", rank:9, when:0}; k="nodone" }
        else {
          const c = new Date(t.completed.getFullYear(), t.completed.getMonth(), t.completed.getDate());
          // Most recent first, matching what the tab already did.
          g = {kind:"day", title:dayKeyFmt.format(c), rank:0, when:-c};
          k = "dn|"+ +c;
        }
      } else if(settings.cpGrouping === "dueDate"){
        if(!t.due){ g = {kind:"nodate", title:"No Due Date", rank:9, when:0}; k="nd" }
        else {
          const d2 = new Date(t.due.getFullYear(), t.due.getMonth(), t.due.getDate());
          g = {kind:"day", title:dayKeyFmt.format(d2), rank:0, when:+d2};
          k = "dd|"+ +d2;
        }
      } else if(isAssignedGrouping(settings.cpGrouping)){
        const who = assigneeOf(t);
        g = assignedSection(who, settings.cpGrouping === "assignedZA"); k = "ag:" + who;
      } else {
        g = {kind:"completed", title:"Completed", rank:0, when:0};
        k = "done";
      }
    } else if(activeTab==="overdue"){
      // No pinned overdue section here: everything is overdue, so that rule
      // would make the whole tab one exempt group and leave the sort inert.
      if(settings.odGrouping === "category"){
        const home = homeCategory(t) || "";
        const order = orderedCategories().map(c => c.name);
        const idx = order.indexOf(home);
        g = { kind:"catgroup", title: home || "No Category", rank:0,
              when: home === "" ? Infinity : (idx < 0 ? 1e6 : idx), urgent:true };
        k = "odcg:" + home;
      } else if(isAssignedGrouping(settings.odGrouping)){
        const who = assigneeOf(t);
        g = assignedSection(who, settings.odGrouping === "assignedZA");
        g.urgent = true; k = "ag:" + who;
      } else if(settings.odGrouping === "ungrouped"){
        g = {kind:"body", title:"Overdue", rank:0, when:0, urgent:true};
        k = "odbody";
      } else {
        const d = new Date(t.due.getFullYear(), t.due.getMonth(), t.due.getDate());
        g = {kind:"day", title:dayKeyFmt.format(d), rank:0, when:+d, urgent:true};
        k = "od|"+ +d;
      }
    } else if(mainTab && mainGrouping === "horizon"){
      // Same shape as due-date grouping, different classifier — so Overdue,
      // Today, Tomorrow and No Due Date behave identically and the placement
      // setting needs no special case.
      g = horizonGroupOf(t); k = g.kind + "|" + g.when;
    } else {
      g = groupOf(t); k = groupKey(g);
    }
    if(!buckets.has(k)) buckets.set(k,{g,items:[]});
    buckets.get(k).items.push(t);
  }
  const sections = [...buckets.values()].sort((a,b)=>
    a.g.rank!==b.g.rank ? a.g.rank-b.g.rank : a.g.when-b.g.when);

  let html="";
  // Only inside a category tab, and only when it would change what you see.
  // Placing it here rather than in Settings means you can flip it while looking
  // at the list it affects.
  if(isCatTab(activeTab)){
    const catName = catOfTab(activeTab);
    const done = completedInCategory(catName);
    if(done > 0){
      // The label says what tapping does, so it flips with the state. The count
      // doesn't: it's the number of completed tasks either way.
      const verb = showsCompletedIn(catName) ? "Hide" : "Show";
      html += `<div class="card" style="margin-top:14px"><div class="note" id="catDoneToggle">
        <span>${verb} ${done} completed task${done===1?"":"s"}</span>
        <span style="margin-left:auto"><span class="toggle ${showsCompletedIn(catName)?"on":""}"
          style="pointer-events:none"><i></i></span></span></div></div>`;
    }
  } else if(COMPLETED_TOGGLE_TABS.includes(activeTab)){
    /* Drives the same global value as the hamburger and Settings — a fourth
       view of one setting, not a fourth setting. Counted within the tab, so
       Today reports only what was completed today and No Category only what's
       untagged. */
    const done = completedForMainTab();
    if(done > 0){
      const verb = showsCompletedInTab(activeTab) ? "Hide" : "Show";
      html += `<div class="card" style="margin-top:14px"><div class="note" id="mainDoneToggle">
        <span>${verb} ${done} completed task${done===1?"":"s"}</span>
        <span style="margin-left:auto"><span class="toggle ${showsCompletedInTab(activeTab)?"on":""}"
          style="pointer-events:none"><i></i></span></span></div></div>`;
    }
  }

  /* Reminders that came due while you were away. Above the undated banner
     because it's a prompt to act rather than a note about a filter, and on
     every tab — a missed reminder isn't a property of the tab you're in. */
  if(showsReminderBanner()){
    const n = dueReminders().length;
    html += `<div class="card" style="margin-top:14px"><div class="note" id="reminderNote"
      style="color:var(--overdue)">
      <span>🔔 ${n} reminder${n===1?"":"s"} due</span>
      <span style="margin-left:auto">›</span></div></div>`;
  }

  /* Directly under the reminders banner, stacking with it rather than sharing a
     row: one says something needs attention, the other says this list isn't
     everything, and merging unrelated statements to save a row makes both harder
     to read. Reminders lead — a due reminder outranks a filter you set yourself
     a minute ago and already know about.

     Names up to two categories and counts beyond, so the line can't wrap and
     double its height however many are ticked. */
  if(filter.size){
    const names = [...filter];
    const label = names.length <= 2
      ? names.join(", ")
      : `${names.length} categories`;
    html += `<div class="card" style="margin-top:14px"><div class="note" id="filterNote">
      <span>⛃ Filtered: ${esc(label)}</span>
      <span style="margin-left:auto;color:var(--navy);font-weight:600">Clear</span></div></div>`;
  }

  const hidden = hiddenUndatedCount();
  if(hidden > 0){
    html += `<div class="card" style="margin-top:14px"><div class="note" id="hiddenNote">
      <span>👁 ${hidden} task${hidden===1?"":"s"} with no due date hidden</span>
      <span style="margin-left:auto">›</span></div></div>`;
  }
  for(const {g,items} of sections){
    // Every group sorts the same way: due date, then A-Z. Within a dated section
    // that still ranks by time of day, and undated tasks fall straight through
    // to alphabetical. Importance deliberately doesn't rank — the row already
    // flags it, and letting it jump tasks around made scanning unpredictable.
    if(activeTab==="done"){
      items.sort(doneComparator);
    } else if(isCatTab(activeTab)){
      // Overdue and undated keep their own ordering even inside a category tab
      // — they're pinned sections, not part of the configured sort.
      /* Overdue keeps oldest-first — how late something is *is* the ordering
         idea there, and no sort level can express it under due-date grouping.
         No Due Date has no date to order by, so nothing justified exempting it:
         choosing Z–A and finding one section still in A–Z reads as a bug, and
         it was the one people actually hit. */
      if(g.kind === "overdue") items.sort((a,b)=> (+a.due!==+b.due) ? a.due-b.due : az(a,b));
      else items.sort(categoryComparator);
    } else if(isNoCatTab(activeTab)){
      if(g.kind === "overdue") items.sort((a,b)=> (+a.due!==+b.due) ? a.due-b.due : az(a,b));
      else items.sort(noCatComparator);
    } else if(activeTab === "all" || activeTab === "today"){
      if(g.kind === "overdue") items.sort((a,b)=> (+a.due!==+b.due) ? a.due-b.due : az(a,b));
      else items.sort(activeTab === "today" ? todayComparator : mainComparator);
    } else if(activeTab==="overdue"){
      items.sort(overdueComparator);
    } else if(activeTab==="nodue"){
      items.sort(undatedComparator);
    } else {
      items.sort(dueThenAz);
    }
    // Keyed on kind+title, the only stable identity available here — the
    // grouping key `k` belongs to an earlier stage and isn't in scope.
    const key = sectionKey(activeTab, g.kind + ":" + g.title);
    /* Collapse is suspended while a search is running. A collapsed heading would
       swallow the very rows the search returned — including the remembered No
       Due Date one, which can sit collapsed for days. Suspended, not cleared:
       clearing the search restores the arrangement you had. */
    const searching = query.trim().length > 0;
    const collapsible = settings.collapsibleSections && !searching;
    const shut = collapsible
      && (isPersistedSection(activeTab, g.kind)
            ? persisted.undatedShut
            : collapsed.has(key));
    html += `<div class="sec-head${(g.kind==="overdue"||g.urgent)?" od":g.kind==="nodate"?" nodate":""}${
      collapsible?" collapsible":""}"${
      collapsible?` data-sec="${esc(key)}"`:""}>`
      + `<span>${collapsible?`<span class="chev${shut?" shut":""}">▾</span>`:""}${g.title.toUpperCase()}</span>`
      + `<span class="num">${items.length}</span></div>`;
    if(shut){ continue }
    html += `<div class="card">`;
    for(const t of items){
      /* Per tab. With details hidden a row keeps its subject, its category
         colors and the due date — the field people navigate by, and the only
         one that turns red when late. The bell, the repeat summary, "Waiting",
         the assignee and the completion stamp all move into the task itself. */
      const terse = hidesDetails(activeTab);
      const meta=[];
      if(t.due) meta.push(`<span class="${isOverdue(t)?"od":""} num">${isOverdue(t)?"⚠ ":"🗓 "}${fmt(t.due)}</span>`);
      if(!terse){
        if(t.reminder) meta.push("<span>🔔</span>");
        if(t.rec) meta.push(`<span>🔁 ${esc(recShort(t.rec))}</span>`);
        if(t.status==="WaitingOnOthers") meta.push("<span>Waiting</span>");
      }
      // Each name in its own category's color; a neutral dot keeps two
      // adjacent names from reading as one.
      t.categories.forEach((c,i)=>{
        const col = catColor(c);
        if(i>0 || meta.length) meta.push(`<span style="color:var(--hairline)">·</span>`);
        meta.push(`<span style="color:${col?darkenForText(col):"var(--slate)"};${col?"font-weight:500":""}">${esc(c)}</span>`);
      });
      // Overdue wins when a row could be both — it can't here (an undated task
      // is never overdue), but the precedence is stated rather than implied.
      const wash = (isOverdue(t) && settings.shadeOverdue) ? " late"
                 : (!t.due && !isDone(t) && settings.shadeUndated) ? " undated" : "";
      html += `<div class="rowwrap${wash}" data-wrap="${t.id}">`
        + `<button class="swipeact" data-del="${t.id}">Delete</button>`
        + `<div class="row" data-open="${t.id}">`
        + spine(t.categories)
        + `<button class="check ${isDone(t)?"done":""}" data-toggle="${t.id}" aria-label="Toggle complete"></button>`
        + `<div class="rowbody">`
          + `<div class="subj ${isDone(t)?"done":""}"${isDone(t)?"":` style="${subjectCSS(t)}"`}>${esc(t.subject)}</div>`
          + (meta.length?`<div class="meta">${meta.join("")}</div>`:"")
          + ((!terse && t.pct>0 && !isDone(t))?`<div class="bar"><i style="width:${t.pct}%"></i></div>`:"")
          // Bottom-right of the row. Shown for any completed task carrying a
          // stamp, not only inside the Completed tab — a row in the All Tasks
          // completed section answers the same question.
          // One line carrying both. The assignee left, the completion stamp
          // right, so they grow toward each other rather than into each other.
          // The meta line above is already at ~50 characters on a third of
          // rows, so a name there would wrap them.
          + ((!terse && (assigneeOf(t) || (isDone(t)&&t.completed)))
             ? `<div class="rowfoot">`
               + (assigneeOf(t)
                  ? `<span class="assignee" title="Assigned to ${esc(t.companies.join(", "))}">`
                    + `<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5" r="3"/>`
                    + `<path d="M2 15c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>`
                    + `${esc(assigneeOf(t))}${t.companies.length>1?` +${t.companies.length-1}`:""}</span>`
                  : `<span></span>`)
               + ((isDone(t)&&t.completed)?`<span class="donedate">Completed ${fmt(t.completed)}</span>`:"")
             + `</div>`
             : "")
        + `</div>`
        + `<span class="gutter">`
          + (t.importance==="High"?'<span class="bang" title="High importance">!</span>':"")
          + (t.dirty?'<span class="dirty">↻</span>':"")
        + `</span>`
      + `</div></div>`;
    }
    html += "</div>";
  }
  list.innerHTML = html;
  repaint(list);
}

/* iOS leaves a scroller's rendered layer stale when its contents are replaced
   while the keyboard is up — the rows are in the DOM and measurable, they just
   aren't painted, so the list appears to stop after the first section until
   some other event forces a layout (switching tabs did it).

   Removing `-webkit-overflow-scrolling: touch` wasn't enough on its own: the
   frame is also resizing at that moment, because its height subtracts the
   keyboard. Detaching the element from layout and reading a geometry property
   forces a synchronous reflow, and the second pass on the next frame catches
   the case where the viewport is still settling when the first one runs. */
function repaint(node){
  if(!node || !node.style) return;
  // Detaching from layout and reading geometry forces a reflow...
  const shown = node.style.display;
  node.style.display = "none";
  void node.offsetHeight;
  node.style.display = shown || "";
  // ...but a reflow isn't a repaint. The scroller keeps its own composited
  // layer, and that's what goes stale. Dropping `overflow` makes it stop being
  // a scroll container, which discards the layer; restoring it builds a fresh
  // one around content that is already laid out.
  const flow = node.style.overflowY;
  node.style.overflowY = "visible";
  void node.offsetHeight;
  node.style.overflowY = flow || "auto";
  // A scroll of zero pixels still counts as a scroll event, which is the thing
  // iOS reliably repaints for.
  const top = node.scrollTop;
  node.scrollTop = top + 1;
  node.scrollTop = top;
  if(typeof requestAnimationFrame === "function"){
    requestAnimationFrame(() => { node.scrollTop = node.scrollTop });
  }
}

/* Scroll the strip itself rather than calling scrollIntoView on the pill.
   scrollIntoView walks up and scrolls EVERY scrollable ancestor, which dragged
   the whole screen sideways and pushed the list off its left margin. Setting
   scrollLeft on the strip can only ever move the strip. */
function centerPill(tab){
  const strip = el("tabs");
  if(!strip.querySelector) return;
  const btn = strip.querySelector(`[data-tab="${tab}"]`);
  if(!btn || !strip.scrollTo) return;
  const target = btn.offsetLeft - (strip.clientWidth - btn.offsetWidth) / 2;
  strip.scrollTo({ left: Math.max(0, target), behavior: "smooth" });
}

function renderTabs(){
  const current = effectiveTab();
  el("tabs").innerHTML = availableTabs().map(tab=>{
    const on = current===tab;
    // Computed only when it will be shown: hiding a number you already
    // calculated saves nothing, and the scan is the whole cost.
    const bdg = showsBadge(tab);

    if(isNoCatTab(tab)){
      // White fill needs an outline or it vanishes against the paper tab bar.
      return `<button data-tab="${esc(tab)}" class="cat nocat ${on?"on":""}"
        style="background:#fff;color:var(--ink)">
        No Category${bdg?`<span class="bdg" style="background:var(--canvas);color:var(--slate)">${tabCount(tab)}</span>`:""}</button>`;
    }
    if(!isCatTab(tab)){
      return `<button data-tab="${esc(tab)}" class="${on?"on":""}">
        ${TAB_TITLE[tab]}${bdg?`<span class="bdg">${tabCount(tab)}</span>`:""}</button>`;
    }
    // Category pills always wear their own color — that IS the label. Selection
    // is a ring rather than a fill, since the fill is already spoken for.
    const cat = CATEGORIES.find(c=>c.name===catOfTab(tab));
    const hex = cat ? PALETTE[cat.colorIndex] : "#BDC3C7";
    const ink = readableOn(hex);
    return `<button data-tab="${esc(tab)}" class="cat ${on?"on":""}"
      style="background:${hex};color:${ink}">
      ${esc(catOfTab(tab))}${bdg?`<span class="bdg" style="background:${ink==="#fff"
        ? "rgba(255,255,255,.24)" : "rgba(0,0,0,.14)"};color:${ink}">${tabCount(tab)}</span>`:""}</button>`;
  }).join("");
}
/* Long press rather than a second tap target: the pill is small and its tap
   already means "switch to this tab". iOS uses a context menu here; the browser
   gets the same gesture. */
(function(){
  let timer = null, fired = false;
  const strip = el("tabs");
  const start = e => {
    const b = e.target.closest("[data-tab]");
    if(!b) return;
    fired = false;
    timer = setTimeout(() => {
      fired = true;
      toggleBadge(b.dataset.tab);
      renderTabs();
      toast(showsBadge(b.dataset.tab) ? "Count shown" : "Count hidden");
    }, 500);
  };
  const stop = () => { if(timer) clearTimeout(timer); timer = null };
  strip.addEventListener("pointerdown", start);
  strip.addEventListener("pointerup", stop);
  strip.addEventListener("pointerleave", stop);
  strip.addEventListener("pointercancel", stop);
  // Swallow the click that follows a long press, or the tab switches too.
  strip.addEventListener("click", e => { if(fired){ fired = false; e.stopPropagation() } }, true);
  strip.addEventListener("contextmenu", e => e.preventDefault());
})();

el("tabs").onclick = e => {
  const b = e.target.closest("[data-tab]");
  if(b && b.dataset.tab!==activeTab){
    activeTab = b.dataset.tab;
    renderList();
    centerPill(activeTab);
  }
};

/* ---------- Filter popover ---------- */
/* Categories in filter order: ordered ones first, then orphans — on tasks but
   absent from the master list — alphabetically, since they have no position. */
/* Held to categoryEarnsPill — the same test the tab bar uses — so a category
   leaves the filter list and the pills at the same moment. It previously counted
   any task carrying the name, completed or not, so finishing the last task in a
   category dropped its pill but left it here, and the two contradicted each
   other. Filtering to a category holding only completed tasks is the Completed
   tab's job, and switching on completed tasks for that category brings back
   both its pill and this row. */
function filterableCategories(){
  const used = new Set(tasks.flatMap(t=>t.categories));
  const listed = orderedCategories().map(c=>c.name);
  const known = listed.filter(categoryEarnsPill);
  const orphans = [...used].filter(n=>!listed.includes(n) && categoryEarnsPill(n))
    .sort((a,b)=>a.localeCompare(b, undefined, {sensitivity:"base"}));
  return { rows: known.concat(orphans), orphans };
}

function categoryFilterRow(n, orphans){
  const col = catColor(n);
  // Filtering only. Reordering lives in the Categories screen, where a drag
  // handle beats tapping arrows — and where the Swift app already puts it.
  return `<div class="catrow" data-filter="${esc(n)}" style="cursor:pointer">
    <span class="chip"><span class="dot ${col?"":"none"}" style="${col?`background:${col}`:""}"></span>${esc(n)}${
      orphans.includes(n) ? ' <span style="color:var(--slate);font-size:11px">not in list</span>' : ""}</span>
    ${filter.has(n)?'<span class="tick">✓</span>':""}
  </div>`;
}

/* The menu shows at most five, and prefers whatever is currently ticked — the
   common case is clearing a filter you just set, which should stay one tap. The
   rest live on their own page, which is what 30 or 40 categories actually need. */
const MENU_FILTER_LIMIT = 5;

function renderPop(){
  const { rows, orphans } = filterableCategories();

  const inactive = rows.filter(n => !filter.has(n));

    (filter.size?`<div class="catrow" id="clearFilter" style="cursor:pointer">
       <span style="color:var(--ink);font-weight:600">Clear filter</span>
       <span class="num" style="color:var(--slate)">${filter.size}</span></div>`:"")+

    (remaining > 0

      : "")+


    // No status readout beside it: the placement label was passive text among
    // controls, told you a value you couldn't act on, and duplicated what the

    // The ellipsis stays: in Apple's language a trailing "…" means the item
    // opens something rather than acting immediately, which is exactly what
    // this does. No chevron — that would say "pushes a screen to the right",

    `<div class="foot settingsfoot"><button id="openSettings">`

      + `</svg>Task Perfect settings…</button></div>`;

/* ---------- Detail sheet ---------- */
let isNewTask = false;

/* Reuses the detail sheet rather than a separate "quick add" form, so every
   field — dates, categories, recurrence, notes — is available at creation
   instead of forcing a save-then-edit round trip.
   Seeded from the tab you're standing in: adding from Today lands on today
   rather than making you set the date you clearly already meant. */
/* How much of the screen the keyboard is covering.
   iOS never tells an app the keyboard is open, but it does shrink the visual
   viewport — the difference between that and the layout viewport is the
   keyboard's height. Feeding it to the sheet as bottom padding gives the
   scroller somewhere to go; without it the browser clamps the scroll position
   part-way and the top of the form can't be reached until the keyboard closes. */
/* Pulled out of trackKeyboard so every path that needs the frame re-measured
   can call the same function — the viewport listeners, and the simulated
   relaunch, which has no viewport event of its own. Three separate symptoms
   (vanishing search results, a list stuck at 302px, a sign-in button under the
   browser toolbar) were all this one measurement being stale, so it gets one
   home rather than a fix per symptom. */
function syncFrame(){
  const vv = window.visualViewport;
  if(!vv) return;
  /* Only claim the keyboard is up while something is actually focused.
     Edge and Safari on iOS don't always fire a final resize when the keyboard
     closes, so `covered` stayed at its keyboard-height value — and since the
     frame's height subtracts it, the frame stayed short. */
  const focused = document.activeElement;
  // Named `focused`, not `el`: a local `el` here shadowed the el() helper, so
  // the repaint below called an element as a function and threw. The keyboard
  // path never re-measured anything as a result.
  const typing = !!focused && (focused.tagName === "INPUT"
                               || focused.tagName === "TEXTAREA"
                               || focused.isContentEditable);
  const covered = typing
    ? Math.max(0, window.innerHeight - vv.height - vv.offsetTop)
    : 0;
  document.documentElement.style.setProperty("--kbd", covered + "px");
  // iOS scrolls the document to reveal a focused field before the frame has
  // resized, and that offset sticks — which is what pushed the sheet's Cancel
  // and Save under the browser chrome. Pin it back once the frame fits.
  pinPage();
  /* Changing the frame's height doesn't always make Edge and Safari on iOS
     re-measure a flex child inside it. Forcing the list to relayout does, and
     this runs on every viewport change rather than only when the list is
     redrawn — the difference that matters, since the keyboard closing redraws
     nothing. */
  if(typeof requestAnimationFrame === "function"){
    requestAnimationFrame(() => repaint(el("list")));
  } else {
    repaint(el("list"));
  }
}

function trackKeyboard(){
  const vv = window.visualViewport;
  if(!vv) return;
  const apply = syncFrame;
  vv.addEventListener("resize", apply);
  vv.addEventListener("scroll", apply);
  // Blur is the event that actually marks the end of typing, and the one iOS
  // never follows with a viewport resize. The timeout lets the keyboard finish
  // retracting before the frame is measured again.
  document.addEventListener("focusout", () => setTimeout(apply, 60), true);
  document.addEventListener("focusin", () => setTimeout(apply, 60), true);
  window.addEventListener("orientationchange", () => setTimeout(apply, 120));
  apply();

  // Belt and braces: watch the frame itself, so any resize — not just ones the
  // visual viewport reports — makes the list re-measure.
  try {
    if(typeof ResizeObserver === "function"){
      const frame = document.querySelector(".device");
      if(frame){
        /* Only on a real height change. `repaint` alters layout, the observer
           sees that alteration, and repainting again from inside the callback is
           what produced "ResizeObserver loop completed with undelivered
           notifications" — a warning the browser raises as a page error, which
           is why it surfaced the moment an error handler existed to catch it.
           Deferring to the next frame keeps the callback itself layout-free. */
        let lastH = 0;
        new ResizeObserver(entries => {
          const h = Math.round(entries[0].contentRect.height);
          if(h === lastH) return;
          lastH = h;
          requestAnimationFrame(() => repaint(el("list")));
        }).observe(frame);
      }
    }
  } catch(e){}
}


/* The frame is sized to the window, so the page should sit at 0,0 always. A
   focused input or an on-screen keyboard can still drag it, and once dragged it
   stays there — stranding the top of whatever is open above the fold. */
function pinPage(){
  if(typeof window !== "undefined" && window.scrollTo) window.scrollTo(0, 0);
  if(document.documentElement) document.documentElement.scrollTop = 0;
  if(document.body) document.body.scrollTop = 0;
}

function openNewSheet(){
  isNewTask = true;
  // New notes start plain — the simpler body, and what a task created in any
  // other client looks like.
  const draft = {id: nextId++, subject:"", notes:"", bodyType:"Text",
    categories:[], importance:"Normal",
    due:null, start:null, remindAt:null, reminder:false,
    status:"NotStarted", pct:0, rec:null, completed:null};
  /* New tasks start due today at 5pm. Most tasks people add are things they
     mean to deal with now, so a date is the common case and None the exception
     — and an undated task can only be found in two tabs, which is a quiet way
     to lose one. The field still offers None, one tap away.

     Two tabs override it, because the tab says otherwise more loudly than the
     default does: No Due Date, where undated is the entire point, and Completed,
     where a new task isn't finished and would vanish on save. */
  const today = new Date(); today.setHours(17,0,0,0);
  draft.due = (activeTab==="nodue" || activeTab==="done") ? null : today;
  if(isCatTab(activeTab)) draft.categories = [catOfTab(activeTab)];
  // No Category: leave categories empty — that IS the tab's defining trait.
  editing = draft;
  openDate = null;
  renderSheet();
  // One sheet element serves every task, so it keeps whatever scroll position
  // the last one left — which opens a new task partway down its own form.
  el("sheetBody").scrollTop = 0;
  pinPage();
  el("sheetTitle").textContent = "New Task";
  el("shareBtn").classList.add("hidden");
  el("scrim").classList.add("open");
  el("sheet").classList.add("open");

  /* Focus AFTER the slide-in finishes, and with preventScroll.
     Focusing mid-animation makes the browser scroll every scrollable ancestor
     to reveal an element that is still translated off-screen — and that scroll
     offset sticks once the transform settles, leaving the top of the form
     unreachable. preventScroll stops it happening at all. */
  setTimeout(() => {
    const f = document.querySelector('#sheetBody [data-f="subject"]');
    if(!f || !f.focus) return;
    try { f.focus({preventScroll:true}) } catch(_) { /* older browsers */ }
    el("sheetBody").scrollTop = 0;
    pinPage();
  }, 320);
}

function openSheet(id){
  isNewTask = false;
  editing = JSON.parse(JSON.stringify(tasks.find(t=>t.id===id)));
  editing.due = editing.due?new Date(editing.due):null;
  editing.start = editing.start?new Date(editing.start):null;
  editing.remindAt = editing.remindAt?new Date(editing.remindAt):null;
  openDate = null;
  renderSheet();
  el("sheetBody").scrollTop = 0;
  pinPage();
  el("sheetTitle").textContent = "Task";
  el("shareBtn").classList.remove("hidden");
  el("scrim").classList.add("open");
  el("sheet").classList.add("open");
}

const iso = dt => { if(!dt) return ""; const x=new Date(dt);
  return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}` };
const isoT = dt => { if(!dt) return ""; const x=new Date(dt);
  return iso(x)+`T${String(x.getHours()).padStart(2,"0")}:${String(x.getMinutes()).padStart(2,"0")}` };

/* Which date row is expanded. Only one at a time — the pickers are tall. */
let openDate = null;

const seedDate = (days,hour) => { const x=new Date();
  x.setDate(x.getDate()+days); x.setHours(hour,0,0,0); return x };
const sameDayAs = (dt,days,hour) => dt && sameDay(new Date(dt), seedDate(days,hour));

function dateLabel(dt,withTime){
  if(!dt) return "None";
  const d=new Date(dt), n=new Date(), tm=new Date(n); tm.setDate(tm.getDate()+1);
  const y=new Date(n); y.setDate(y.getDate()-1);
  let day;
  if(sameDay(d,n)) day="Today";
  else if(sameDay(d,tm)) day="Tomorrow";
  else if(sameDay(d,y)) day="Yesterday";
  else day=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric",year:"numeric"});
  return withTime ? `${day}, ${d.toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}` : day;
}

/* A date row where None is a choice sitting beside Today and Tomorrow,
   not the absence of one hidden behind a switch. */
function dateRow(label,field,value,withTime,hour){
  const open = openDate===field;
  const quick = [["None",null],["Today",0],["Tomorrow",1],["Next week",7]];
  return `<div class="drow ${open?"open":""}" data-drow="${field}">
      <span class="k">${label}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span class="num" style="color:${value?"var(--ink)":"var(--slate)"}">${dateLabel(value,withTime)}</span>
        <span class="caret">›</span></span>
    </div>
    ${open?`<div class="dpick">
      <div class="quick">${quick.map(([lbl,days])=>{
        const on = days===null ? !value : sameDayAs(value,days,hour);
        return `<button data-quick="${field}" data-days="${days===null?"":days}" data-hour="${hour}" class="${on?"on":""}">${lbl}</button>`;
      }).join("")}</div>
      ${value?`<input type="${withTime?"datetime-local":"date"}" data-f="${field}" data-hour="${hour}"
         value="${withTime?isoT(value):iso(value)}">`:""}
    </div>`:""}`;
}

/* Rebuilds the sheet from `editing`. Called on structural changes only —
   text fields update state silently so typing never loses focus. */
/* Height follows content. Reset to auto first, or the box only ever grows —
   deleting a line would leave the extra height behind. */
function growSubject(el2){
  if(!el2) return;
  el2.style.height = "auto";
  el2.style.height = el2.scrollHeight + "px";
}

function renderSheet(){
  const e = editing;
  el("saveBtn").textContent = isNewTask ? "Add" : "Save";
  const known = new Set(CATEGORIES.map(c=>c.name));
  const orphans = e.categories.filter(c=>!known.has(c));
  const nextUp = e.rec ? upcoming(e.due||new Date(), e.rec, 1)[0] : null;

  el("sheetBody").innerHTML = `
    <div class="group">
      <!-- A textarea, not an input: an input never wraps, so a long subject
           scrolled sideways and the end of it couldn't be read at all. Grows to
           fit and never shows a scrollbar. -->
      <div class="frow"><textarea data-f="subject" class="subjectinput" rows="1"
        placeholder="Subject">${esc(e.subject)}</textarea></div>
      <!-- One row instead of six. The list grows with every category added, so
           an inline picker either caps and hides some, or takes over the sheet.
           Tapping opens the full list; the chips show what's chosen. -->
      <div class="frow" id="openTaskCats" style="cursor:pointer;align-items:flex-start">
        <span class="k">Categories</span>
        <span class="catchips">${
          (e.categories.length === 0)
            ? `<span style="color:var(--slate)">None</span>`
            : e.categories.map(n=>{
                const c = CATEGORIES.find(x=>x.name===n);
                const col = c ? PALETTE[c.colorIndex] : null;
                return `<span class="catchip${c?"":" orphanchip"}">`
                  + `<span class="dot ${col?"":"none"}" style="${col?`background:${col}`:""}"></span>`
                  + `${esc(n)}${c?"":' <span class="orphan">not in list</span>'}</span>`;
              }).join("")
        }</span>
        <span class="v" style="margin-left:8px">›</span></div>
      <div class="frow"><span class="k">Importance</span>
        <select data-f="importance">${["Low","Normal","High"].map(i=>`<option ${e.importance===i?"selected":""}>${i}</option>`).join("")}</select></div>
    </div>

    <div class="glabel">FONT EMPHASIS</div>
    <div class="hint" style="margin:-4px 0 10px 6px">For the occasional task that needs to stand out from others in its category. Everything else follows the category&rsquo;s own styling.</div>
    <div class="group">
      <!-- Below Categories, not above: the order teaches the relationship —
           pick a category, then adjust its style. Three states each: on, off, or
           unset. Unset follows the category, which is what lets a task in a bold
           category be set explicitly regular. -->
      <div class="frow" style="justify-content:flex-end">
        <span style="display:flex;align-items:center;gap:8px">
          ${["bold","italic"].map(k=>{

/* Server and domain live here as well as in Settings, because Settings is
   behind this screen. Defaults are baked in — asking every colleague to type a
   server address is a way to collect typos — but they're editable, because
   Intermedia occasionally moves mailboxes between hosts. */
const SERVER_DEFAULTS = { host:"east.exch092.serverdata.net", domain:"EXCH092" };
let serverConfig = { ...SERVER_DEFAULTS };

/* Strip what people paste: a full URL, a trailing slash, or the /EWS path is
   the common mistake, and it fails with a confusing error rather than an
   obviously wrong address. */
function normalizeHost(raw){
  let v = (raw || "").trim();
  for(const pre of ["https://","http://"])
    if(v.toLowerCase().startsWith(pre)) v = v.slice(pre.length);
  const slash = v.indexOf("/");
  if(slash >= 0) v = v.slice(0, slash);
  return v;
}

/* Reopening the app: what happens depends entirely on the lock mode. */
function reopenApp(){
  // A real launch builds a fresh TaskStore and a fresh TaskListView, so
  // everything held in memory is gone. This prototype's JS never restarts, so
  // the simulation has to discard the same things by hand or it reports state
  // surviving a launch that wouldn't survive one:
  //   collapsed sections  — @State in TaskListView
  //   selected tab        — TaskStore.selectedTab, always .all on launch
  //   search text         — TaskStore.searchText, always empty on launch
  // `persisted` is untouched: it stands in for UserDefaults, which is the
  // whole point of it.
  collapsed.clear();
  activeTab = "all";
  query = "";
  // A launch brings the banner back, and local dismissals don't survive one —
  // they're @State in the real app, not stored anywhere.
  remindersBannerHandled = false;
  dismissedReminders = new Set();
  el("search").value = "";
  el("clearSearch").classList.add("hidden");
  /* A real launch has no focused field and no keyboard, so the simulation has
     to put the frame back that way too. Without this the frame kept the height
     it had while you were typing in the search box, and the sign-in screen came
     up short — with Explore with sample data under the browser toolbar, out of
     reach until the phone was rotated. */
  if(document.activeElement && document.activeElement.blur) document.activeElement.blur();
  document.documentElement.style.setProperty("--kbd", "0px");
  syncFrame();

  el("signin").classList.add("hidden");
  el("locked").classList.add("hidden");
  el("app").classList.add("hidden");

  if(settings.lockMode === "password" || !savedCredentials){
    el("signin").classList.remove("hidden");
    return;
  }
  if(settings.lockMode === "biometric"){
    el("locked").classList.remove("hidden");
    return;
  }
  enterApp();   // staySignedIn
}

/* ================= SWIPE TO DELETE + CONFIRMATION ================= */
let pendingDelete = null;

function closeSwipes(except){
  document.querySelectorAll(".rowwrap.open").forEach(w=>{ if(w!==except) w.classList.remove("open") });
}

/* Pointer events cover touch and mouse, so this is testable on a desktop too. */
(function(){
  let startX=0, startY=0, wrap=null, dragging=false, moved=false;
  const list = el("list");

  list.addEventListener("pointerdown", e => {
    const row = e.target.closest(".row"); if(!row) return;
    wrap = row.closest(".rowwrap"); if(!wrap) return;
    startX=e.clientX; startY=e.clientY; dragging=true; moved=false;
  });

  list.addEventListener("pointermove", e => {
    if(!dragging||!wrap) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    // Vertical intent wins — never fight the scroll.
    if(Math.abs(dy)>Math.abs(dx)){ dragging=false; return }
    if(dx<-8){ moved=true }
  });

  const end = () => {
    if(!dragging||!wrap){ dragging=false; return }
    if(moved){ closeSwipes(wrap); wrap.classList.add("open") }
    dragging=false;
  };
  list.addEventListener("pointerup", end);
  list.addEventListener("pointercancel", end);

  // Swallow the click that follows a swipe so the detail sheet doesn't open.
  list.addEventListener("click", e => {
    if(moved){ moved=false; e.stopPropagation(); e.preventDefault() }
  }, true);
})();

/* One sheet, parameterised — delete and complete ask the same way. */
function askConfirm({title,message,actionLabel,destructive,onConfirm}){
  pendingDelete = onConfirm;
  el("cdlgTitle").textContent = title;
  el("cdlgMsg").textContent = message;
  const btn = el("cdlgDel");
  btn.textContent = actionLabel;
  btn.className = destructive ? "del" : "confirm";
  el("cscrim").classList.add("open");
  el("cdlg").classList.add("open");
}

function askDelete(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  let msg = `"${t.subject}" will be removed from Outlook as well. This can't be undone.`;
  if(t.rec) msg += " Future occurrences will stop.";
  askConfirm({
    title:"Delete this task?", message:msg,
    actionLabel:"Delete Task", destructive:true,
    onConfirm:()=>doDelete(id)
  });
}

/* Remove the row now, send the delete in five seconds. */
function doDelete(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  if(editing && editing.id===id) closeSheet();
  tasks = tasks.filter(x=>x.id!==id);
  renderList();
  stageDelete("task",
    n => n === 1 ? "Task deleted" : `${n} tasks deleted`,
    () => { if(!tasks.some(x => x.id === t.id)) tasks.push(t) },
    () => { enqueueChange("delete", t.id); scheduleAutoSync() });
}

/* Recurring tasks don't simply close — they spawn the next occurrence. Naming
   that date is the whole reason this confirmation earns its keep. */
function completionNote(t){
  if(!t.rec) return `"${t.subject}" will be marked complete. You can reopen it afterwards.`;
  const ref = t.rec.regen ? new Date() : (t.due||new Date());
  const nx = nextDate(ref, t.rec);
  return nx
    ? `This closes the current occurrence and creates the next one, due ${nx.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}.`
    : "This is the last occurrence — completing it ends the series.";
}

function doToggle(t){
  if(t.rec && !isDone(t)){
    const next = completeRecurring(t);
    t.dirty = true;
    enqueueChange("update", t.id);
    if(next){ tasks.push(next); enqueueChange("create", next.id); toast("Next one due "+fmt(next.due)) }
    else toast("Series finished");
    renderList(); scheduleAutoSync();
    return;
  }
  setStatus(t, isDone(t)?"NotStarted":"Completed");
  t.dirty = true; enqueueChange("update", t.id);
  renderList(); scheduleAutoSync();
}

/* Completing is gated; reopening never is. Undo should stay cheap, or people
   get wary of the checkbox itself. */
function requestToggle(id){
  const t = tasks.find(x=>x.id===id); if(!t) return;
  if(settings.confirmComplete && !isDone(t)){
    askConfirm({
      title:"Mark this task complete?", message:completionNote(t),
      actionLabel:"Complete Task", destructive:false,
      onConfirm:()=>doToggle(t)
    });
  } else doToggle(t);
}
function closeConfirm(){
  pendingDelete = null;
  el("cscrim").classList.remove("open");
  el("cdlg").classList.remove("open");
}
el("undoStack").addEventListener("click", e => {
  const b = e.target.closest("[data-undo]");
  if(b) undoDelete(b.dataset.undo);
});
el("cdlgCancel").onclick = () => { closeConfirm(); closeSwipes(null) };
el("cscrim").onclick = () => { closeConfirm(); closeSwipes(null) };
el("cdlgDel").onclick = () => {
  const run = pendingDelete;
  closeConfirm(); closeSwipes(null);
  if(typeof run === "function") run();
};

function openCatEditor(name, isNew){
