/* Rename cascades onto every tagged task. Exchange stores category *names* on
   items, so renaming the list entry alone orphans everything tagged with it. */
function saveCategory(){
  const c = catEditing; if(!c) return;
  const name = (el("catName").value||"").trim();
  if(!name) return;
  const clash = CATEGORIES.find(x=>x.name.toLowerCase()===name.toLowerCase() && x.name!==c.originalName);
  if(clash){ toast(`"${name}" already exists`); return }

  if(isDefaultStyle(c.st)) delete CAT_STYLES[name]; else CAT_STYLES[name] = c.st;

  if(c.isNew){
    CATEGORIES.push({name, colorIndex:c.colorIndex});
  } else {
    const entry = CATEGORIES.find(x=>x.name===c.originalName);
    const oldName = entry.name;
    entry.name = name; entry.colorIndex = c.colorIndex;
    if(oldName !== name){
      if(CAT_STYLES[oldName]){ CAT_STYLES[name]=CAT_STYLES[oldName]; delete CAT_STYLES[oldName] }
      // Keyed by name, so it has to follow the rename too.
      renameCompletedFlag(oldName, name);
      const oi = CAT_ORDER.indexOf(oldName); if(oi>=0) CAT_ORDER[oi] = name;
      let n=0;
      for(const t of tasks){
        const i=t.categories.indexOf(oldName);
        if(i>=0){ t.categories[i]=name; t.dirty=true; n++ }
      }
      if(filter.has(oldName)){ filter.delete(oldName); filter.add(name) }
      if(n) toast(`Renamed on ${n} task${n===1?"":"s"}`);
    }
  }
  closeCatEditor(); renderCats(); renderList(); renderPop(); scheduleAutoSync();
}

el("catBody").addEventListener("click", e => {
  const up = e.target.closest("[data-moveup]");
  if(up){ moveCategory(up.dataset.moveup, -1); renderCats(); renderList(); renderPop(); return }
  const dn = e.target.closest("[data-movedn]");
  if(dn){ moveCategory(dn.dataset.movedn, 1); renderCats(); renderList(); renderPop(); return }
  // Two copies of the button, so keyed by data attribute rather than id.
  if(e.target.closest("[data-resetorder]")){ resetCategoryOrder(); renderCats(); renderList(); renderPop();
    toast("Categories sorted A-Z"); return }

  const del = e.target.closest("[data-delcat]");
  if(del){
    const name = del.dataset.delcat, n = catCount(name);
    /* Snapshot everything undo has to put back. Styling and ordering are keyed
       by name and get cleared on the way out; the tagged task IDs have to be
       captured *before* the strip, or there'd be nothing left to identify them
       by afterwards. */
    const removeCategory = (stripFromTasks) => {
      const catSnapshot = CATEGORIES.slice();
      const styleSnapshot = CAT_STYLES[name];
      const orderIndex = CAT_ORDER.indexOf(name);
      const wasFiltered = filter.has(name);
      const taggedIDs = stripFromTasks
        ? tasks.filter(t => t.categories.includes(name)).map(t => t.id) : [];

      CATEGORIES = CATEGORIES.filter(c=>c.name!==name);
      filter.delete(name);
      delete CAT_STYLES[name];
      clearCompletedFlag(name);
      CAT_ORDER = CAT_ORDER.filter(x=>x!==name);
      if(stripFromTasks) tasks.forEach(t => {
        const i = t.categories.indexOf(name);
        if(i >= 0) t.categories.splice(i, 1);
      });
      renderCats(); renderList(); renderPop();

      stageDelete("category",
        () => stripFromTasks && taggedIDs.length
          ? `${name} deleted from ${taggedIDs.length} task${taggedIDs.length===1?"":"s"}`
          : `${name} deleted`,
        () => {
          CATEGORIES = catSnapshot;
          if(styleSnapshot) CAT_STYLES[name] = styleSnapshot;
          if(orderIndex >= 0) CAT_ORDER.splice(Math.min(orderIndex, CAT_ORDER.length), 0, name);
          if(wasFiltered) filter.add(name);
          taggedIDs.forEach(id => {
            const t = tasks.find(x => x.id === id);
            if(t && !t.categories.includes(name)) t.categories.push(name);
          });
          renderCats(); renderPop();
        },
        () => {
          taggedIDs.forEach(id => enqueueChange("update", id));
          scheduleAutoSync();
        });
    };
    // Without the prompt the label stays on tasks — the option to strip it only
    // exists inside the dialog.
    // Without the prompt the label stays on tasks — the option to strip it only
    // exists inside the dialog.
    if(!settings.confirmCategoryDelete){ removeCategory(false); return }
    askConfirm({
      title:"Delete this category?",
      message: n===0 ? `"${name}" isn't used by any task.`
        : `${n} task${n===1?"":"s"} use "${name}". They'll keep the label but lose its color.`,
      actionLabel:"Delete Category", destructive:true,
      onConfirm:()=>removeCategory(false)
    });
    return;
  }
  const ed = e.target.closest("[data-editcat]");
  if(ed){ openCatEditor(ed.dataset.editcat, false); return }
  const add = e.target.closest("[data-addcat]");
  if(add){ openCatEditor(add.dataset.addcat, true); return }

});

/* How late it is, which is the thing worth knowing — the exact time is on the
   task itself. */
function relativeReminder(when){
  const mins = Math.round((Date.now() - new Date(when)) / 60000);
  if(mins < 60) return `Reminder ${mins} minute${mins===1?"":"s"} ago`;
  const hrs = Math.round(mins/60);
  if(hrs < 24) return `Reminder ${hrs} hour${hrs===1?"":"s"} ago`;
  const days = Math.round(hrs/24);
  return `Reminder ${days} day${days===1?"":"s"} ago`;
}

el("badgeBody").addEventListener("click", e => {
  const bt = e.target.closest("[data-badge]");
  if(bt){ toggleBadge(bt.dataset.badge); renderBadges(); renderList(); return }
  const at = e.target.closest("[data-always]");
  if(at){ toggleAlwaysShown(at.dataset.always); renderBadges(); renderList(); return }
  const bulk = e.target.closest("[data-bulk]")?.dataset.bulk;
  if(bulk==="badgesOn"){ hiddenBadgeTabs.clear(); renderBadges(); renderList(); return }
  if(bulk==="badgesOff"){ hiddenBadgeTabs = new Set(availableTabs()); renderBadges(); renderList(); return }
  if(bulk==="pinOn"){
    alwaysShownTabs = new Set(availableTabs().filter(canToggleVisibility));
    renderBadges(); renderList(); return;
  }
  if(bulk==="pinOff"){ alwaysShownTabs.clear(); renderBadges(); renderList(); }
});
el("badgeBack").onclick = closeBadges;
el("sfBack").onclick = () => { el("searchfields").classList.remove("open") };
el("sfDone").onclick = () => closeAllPanels();
el("sfBody").onclick = e => {
  const t = e.target.closest("[data-searchfield]");
  if(!t) return;
  const f = t.dataset.searchfield;
  if(searchFields.has(f)){ if(searchFields.size > 1) searchFields.delete(f) }
  else searchFields.add(f);
  renderSearchFields(); renderList();
};
el("detBack").onclick = () => { el("details").classList.remove("open") };
el("detDone").onclick = () => closeAllPanels();
el("detBody").onclick = e => {
  const tog = e.target.closest("[data-detail]");
  if(tog){ const t = tog.dataset.detail; setHidesDetails(t, !hidesDetails(t)); renderDetails(); renderList(); return }
  const db = e.target.closest("[data-detbulk]")?.dataset.detbulk;
  if(db==="hide"){ detailTabs().forEach(t=>detailsHidden.add(t)); renderDetails(); renderList(); return }
  if(db==="show"){ detailsHidden.clear(); renderDetails(); renderList(); return }
};
el("remDone").onclick = () => { remindersBannerHandled = true; closeAllPanels(); renderList() };
el("remDismissAll").onclick = () => {
  // Clears the lot without touching the tasks themselves.
  dueReminders().forEach(t => dismissedReminders.add(t.id));
  remindersBannerHandled = true;
  closeAllPanels(); renderList();
};
el("remBody").onclick = e => {
  const dis = e.target.closest("[data-remdismiss]");
  if(dis){ dismissedReminders.add(+dis.dataset.remdismiss); renderReminders(); renderList(); return }
  const open = e.target.closest("[data-remopen]");

};

el("setBody").addEventListener("change", e => {
  // Undo pickers first: the range guard below returns early and would swallow
  // every other change event on this panel.
  const sv = e.target.dataset.server;
  if(sv){
    // Empty falls back to the shipped default rather than saving a blank the
    // app can't use.
    if(sv === "host"){
      const h = normalizeHost(e.target.value);
      serverConfig.host = h || SERVER_DEFAULTS.host;
    } else {
      // Optional: blank is a legitimate setting, not a missing one — signing in
      // with a full e-mail address authenticates without it.
      serverConfig.domain = (e.target.value || "").trim();
    }
    renderSettings();
    return;
  }
  const us = e.target.dataset.undosecs;
  if(us){
    if(us==="task") settings.taskUndoSecs = +e.target.value;
    else settings.categoryUndoSecs = +e.target.value;
    renderSettings();
    return;
  }
  const r = e.target.dataset.range;
  if(!r) return;
  if(r==="past") settings.pastLimit = e.target.value;
  else settings.futureLimit = e.target.value;
  renderSettings(); renderList();
});

el("setBody").addEventListener("click", e => {
  const pl = e.target.closest("[data-place]");
  if(pl){ settings.noDuePlacement = pl.dataset.place; renderSettings(); renderList(); return }
  if(e.target.closest('[data-set="confirm"]')){ settings.confirmComplete=!settings.confirmComplete; renderSettings(); return }
  if(e.target.closest('[data-set="confirmdel"]')){ settings.confirmTaskDelete=!settings.confirmTaskDelete; renderSettings(); return }
  if(e.target.closest('[data-set="confirmcatdel"]')){ settings.confirmCategoryDelete=!settings.confirmCategoryDelete; renderSettings(); return }
  if(e.target.closest('[data-set="offertaskundo"]')){ settings.offerTaskUndo=!settings.offerTaskUndo; renderSettings(); return }
  if(e.target.closest('[data-set="offercatundo"]')){ settings.offerCategoryUndo=!settings.offerCategoryUndo; renderSettings(); return }
  if(e.target.closest('[data-set="syncopen"]')){ settings.syncOnOpen=!settings.syncOnOpen; renderSettings(); return }
  if(e.target.closest('[data-set="syncclose"]')){ settings.syncOnClose=!settings.syncOnClose; renderSettings(); return }
  if(e.target.closest('[data-set="badge"]')){ settings.showAppBadge=!settings.showAppBadge; renderSettings(); return }
  if(e.target.closest('[data-set="collapsible"]')){
    settings.collapsibleSections = !settings.collapsibleSections;
    // Turning it off must expand everything, or sections would stay hidden with
    // no control left to reveal them.
    if(!settings.collapsibleSections) collapsed.clear();
    renderSettings(); renderList(); return;
  }
  if(e.target.closest('[data-set="rememberundated"]')){
    // Inert while the parent is off — the row is dimmed to say so.
    if(!settings.collapsibleSections) return;
    persisted.remember = !persisted.remember;
    // Hand the state across in both directions so the section doesn't jump open
    // or shut underneath you when the memory is switched.
    const key = "all|nodate:No Due Date";
    if(persisted.remember){
      persisted.undatedShut = collapsed.has(key);
      collapsed.delete(key);
    } else if(persisted.undatedShut){
      collapsed.add(key);
    }
    savePersisted();
    renderSettings(); renderList(); return;
  }
  if(e.target.closest('[data-set="remindersopen"]')){
    settings.remindersOnOpen = !settings.remindersOnOpen;
    // Turning it back on within a session should show the banner again, or the
    // toggle looks broken until the next launch.
    if(settings.remindersOnOpen) remindersBannerHandled = false;
    renderSettings(); renderList(); return;
  }
  if(e.target.closest('[data-set="shadeod"]')){ settings.shadeOverdue=!settings.shadeOverdue; renderSettings(); renderList(); return }
  if(e.target.closest('[data-set="shadend"]')){ settings.shadeUndated=!settings.shadeUndated; renderSettings(); renderList(); return }
  if(e.target.closest("#openSearchFields")){ openSearchFields(); return }

/* Stands in for a real EWS round trip: the button disables, the header shows the
   new timestamp, and the list re-renders. */
let lastSynced = new Date();
/* ================= UNDO =================
   Delays the send rather than reversing it. The row disappears immediately, but
   nothing reaches the queue until the window closes — so undo has nothing to
   undo, it just cancels. A true reversal would need Exchange to hand the item
   back from Deleted Items, which varies by retention policy and returns a new
   ItemId that no longer matches the local record. */
/* Two independent slots. Deleting a task must not cut short a pending category
   delete — that separation is the point of having two. */
const undoSlots = { task: null, category: null };

/* Tasks batch, categories don't. Deleting three tasks and changing your mind
   almost always means wanting all three back; two staged category deletions can
   touch overlapping task lists, and untangling which restore owns which tag
   isn't worth it for something that rare. */
const BATCHES = { task: true, category: false };

function stageDelete(kind, describe, restore, commit){
  // Undo off: send it now. Staging with a zero window would still flash a bar
  // the user can't use.
  const offered = kind === "task" ? settings.offerTaskUndo : settings.offerCategoryUndo;
  if(!offered){ commit(); return }
  const secs = kind === "task" ? settings.taskUndoSecs : settings.categoryUndoSecs;
  const slot = undoSlots[kind];

  if(BATCHES[kind] && slot){
    // Join the existing bar and restart its clock. The first item gets a longer
    // reprieve than it would alone, which is the right trade.
    slot.entries.push({restore, commit});
    slot.message = describe(slot.entries.length);
    clearTimeout(slot.timer);
    slot.timer = setTimeout(() => commitPendingDeletes(kind), secs * 1000);
  } else {
    // Not batching, or nothing staged: flush rather than drop, or the earlier
    // delete would never be sent.
    commitPendingDeletes(kind);
    undoSlots[kind] = { message: describe(1), entries: [{restore, commit}],
      timer: setTimeout(() => commitPendingDeletes(kind), secs * 1000) };
  }
  renderUndoBars();
}

function undoDelete(kind){
  const slot = undoSlots[kind];
  if(!slot) return;
  clearTimeout(slot.timer);
  undoSlots[kind] = null;
  // Newest first, so restores touching the same records unwind in the order
  // they were applied.
  slot.entries.slice().reverse().forEach(e => e.restore());
  renderUndoBars();
  renderList();
  toast(slot.entries.length === 1 ? "Restored" : `Restored ${slot.entries.length}`);
}

/* Called when a window closes and — critically — when the app backgrounds. A
   staged delete that survived a quit would look deleted, not be, and offer no
   way back. Omit `kind` to flush both. */
function commitPendingDeletes(kind){
  const kinds = kind ? [kind] : ["task","category"];
  for(const k of kinds){
    const slot = undoSlots[k];
    if(!slot) continue;
    clearTimeout(slot.timer);
    undoSlots[k] = null;
    slot.entries.forEach(e => e.commit());
  }
  renderUndoBars();
}

/* Both can be pending at once, so they stack rather than one replacing the
   other. */
function renderUndoBars(){
  const bars = ["category","task"].filter(k => undoSlots[k]).map(k =>
    `<div class="undobar show" data-bar="${k}"><span>${esc(undoSlots[k].message)}</span>
       <button data-undo="${k}">Undo</button><i class="grip"></i></div>`).join("");
  el("undoStack").innerHTML = bars;
}

/* Slide down to dismiss, which commits.
   The bar tracks the finger the whole way — a gesture with no visual response
   is indistinguishable from a broken one. Release past the threshold commits;
   release short of it springs back. Downward only: an accidental sideways
   swipe shouldn't end the window. */
const DISMISS_THRESHOLD = 44;
(function(){
  let y0 = 0, x0 = 0, bar = null, dragging = false, decided = false;
  const stack = el("undoStack");

  stack.addEventListener("pointerdown", e => {
    bar = e.target.closest("[data-bar]");
    if(!bar) return;
    // Not on the Undo button — that has its own job.
    if(e.target.closest("[data-undo]")){ bar = null; return }
    y0 = e.clientY; x0 = e.clientX;
    dragging = true; decided = false;
    bar.style.transition = "none";
    if(e.pointerId != null && stack.setPointerCapture) {
      try { stack.setPointerCapture(e.pointerId) } catch(_) {}
    }
  });

  stack.addEventListener("pointermove", e => {
    if(!dragging || !bar) return;
    const dy = e.clientY - y0, dx = e.clientX - x0;

    // Decide the axis once, on the first meaningful movement, then commit to
    // it — otherwise a slightly diagonal drag flickers between the two.
    if(!decided && (Math.abs(dy) > 6 || Math.abs(dx) > 6)){
      decided = true;
      if(Math.abs(dx) > Math.abs(dy)){ reset(); return }   // sideways: ignore
    }
    if(!decided) return;
    if(dy < 0) return;                                     // upward: ignore

    bar.style.transform = `translateY(${dy}px)`;
    bar.style.opacity = String(Math.max(0, 1 - dy / 140));
  });

  const finish = e => {
    if(!dragging || !bar) return;
    const dy = (e.clientY || 0) - y0;
    const target = bar;
    dragging = false;
    if(decided && dy > DISMISS_THRESHOLD){
      target.style.transition = "all .18s";
      target.style.transform = "translateY(120px)";
      target.style.opacity = "0";
      const kind = target.dataset.bar;
      setTimeout(() => { commitPendingDeletes(kind); toast("Deleted") }, 140);
    } else {
      reset();
    }
    bar = null;
  };

  function reset(){
    if(!bar) return;
    bar.style.transition = "all .18s";
    bar.style.transform = "";
    bar.style.opacity = "";
    dragging = false;
  }

  stack.addEventListener("pointerup", finish);
  stack.addEventListener("pointercancel", () => { reset(); bar = null });
})();

/* Sync only what changed: push the locally edited tasks, leave the rest alone.
   Every device-side edit carries a dirty flag, so the pending set is already
   tracked — a sync drains it rather than re-sending the whole list. */
const pendingChanges = () => tasks.filter(t => t.dirty);

/* Offline simulation. The real app watches NWPathMonitor; a browser tab can be
   told to pretend. */
let isOffline = false;

/* Tabs whose badge is switched off, by tab id. Stores the DISABLED set rather
   than the enabled one, so a category added next year defaults to showing its
   badge without anything having to be written here first. */
let hiddenBadgeTabs = new Set();

/* Tabs pinned visible even when empty. Stores the PINNED set rather than the
   disappearing one, so a category added next year inherits the default —
   disappearing when empty — without anything written here first. Same inversion
   as hiddenBadgeTabs, for the same reason. */
let alwaysShownTabs = new Set();
/* Never disappear regardless. Their toggles are shown but disabled: an absent
   control raises "where did it go", a disabled one answers itself. */
const ALWAYS_VISIBLE = new Set(["all","today","done"]);
const isAlwaysShown = t => ALWAYS_VISIBLE.has(t) || alwaysShownTabs.has(t);
const canToggleVisibility = t => !ALWAYS_VISIBLE.has(t);
function toggleAlwaysShown(t){
  if(!canToggleVisibility(t)) return;
  if(alwaysShownTabs.has(t)) alwaysShownTabs.delete(t); else alwaysShownTabs.add(t);
}
const showsBadge = tab => !hiddenBadgeTabs.has(tab);
function toggleBadge(tab){
  if(hiddenBadgeTabs.has(tab)) hiddenBadgeTabs.delete(tab); else hiddenBadgeTabs.add(tab);
}

/* The durable queue. In the real app this is a SwiftData table, so an edit made
   on a plane survives the app being killed. Coalesced on insert — checking a
   task off and on ten times must not become twenty requests describing one
   final state. */
let changeQueue = [];

function enqueueChange(op, id){
  const existing = changeQueue.filter(c => c.id === id);
  if(op === "delete"){
    const hadCreate = existing.some(c => c.op === "create");
    changeQueue = changeQueue.filter(c => c.id !== id);
    // Created and deleted before either reached the server: as far as Exchange
    // is concerned the task never existed, so send nothing.
    if(!hadCreate) changeQueue.push({op:"delete", id});
    return;
  }
  if(op === "update"){
    // A queued create already covers it — the payload is read fresh at send
    // time, so the newer edit rides along. A queued update likewise.
    if(existing.some(c => c.op === "create" || c.op === "update")) return;
  }
  if(op === "create" && existing.length) return;
  changeQueue.push({op, id});
}

/* Coalesced, not immediate. Checking off five tasks in a row is five changes but
   should be one round trip — firing on each would leave the app in a permanent
   sync spin and, on a slow link, queue syncs faster than they finish. Each call
   cancels the one before it, so the sync lands shortly after you stop. */
let autoSyncTimer = null;
function scheduleAutoSync(){
  if(!settings.syncAfterChanges) return;
  if(autoSyncTimer) clearTimeout(autoSyncTimer);
  autoSyncTimer = setTimeout(()=>{ autoSyncTimer = null; runSync("Auto") }, 2000);
}

function runSync(reason){
  const btn = el("syncBtn");
  if(btn.classList.contains("spinning")) return;

  // Offline isn't an error — the queue is already holding the work and drains
  // on reconnect. The user just needs to know why nothing moved.
  if(isOffline){
    toast(changeQueue.length
      ? `Offline — ${changeQueue.length} change${changeQueue.length===1?"":"s"} waiting`
      : "Offline");
    return;
  }

  const pending = pendingChanges();
  const drained = changeQueue.length;
  btn.classList.add("spinning");
  setTimeout(()=>{
    pending.forEach(t => { t.dirty = false });
    changeQueue = [];
    lastSynced = new Date();
    btn.classList.remove("spinning");
    renderList();
    const summary = drained
      ? `Synced ${drained} change${drained===1?"":"s"}`
      : "Up to date";
    toast(reason ? `${reason} — ${summary.toLowerCase()}` : summary);
  }, 600);
}

/* Flipping back online drains immediately, rather than waiting for the user to
   notice and tap sync. */
function setOffline(off){
  const wasOffline = isOffline;
  isOffline = off;
  renderList();
  if(wasOffline && !off && changeQueue.length) runSync("Back online");
}

/* Started here, not at the definition: it calls pinPage(), which is declared
   further down. */
// Viewport and observer APIs behave differently in embedded viewers, and none
// of this is load-bearing: without it the frame simply doesn't track the
// keyboard. Never worth stopping the whole script for.
try { if(typeof window !== "undefined") trackKeyboard() } catch(e){}

/* visibilitychange is the browser's closest analogue to an iOS scene phase
   change — backgrounding the tab stands in for closing the app. */
document.addEventListener("visibilitychange", () => {

  if(document.hidden){ commitPendingDeletes(); if(settings.syncOnClose) lastSynced = new Date() }
  else if(settings.syncOnOpen){ runSync("Synced on open") }

/* Two representations, shared together: readable text for the message body and
   what the printer lays out, plus an .ics the recipient can import as a task of
   their own. The .ics is a snapshot — nothing links back and no status returns,
   deliberately unlike Exchange task assignment. */
function shareText(t){
  const rows = [];
  const add = (label, value) => { if(value) rows.push(label.padEnd(13) + value) };
  add("Due:", t.due ? fmt(t.due) : "");
  add("Start:", t.start ? fmt(t.start) : "");
  add("Category:", t.categories.join(", "));
  add("Assigned to:", (t.companies||[]).join(", "));
  if(t.importance === "High") add("Priority:", "High");
  if(t.rec) add("Repeats:", recSummary(t.rec));
  if(isDone(t)) add("Completed:", t.completed ? fmt(t.completed) : "Yes");
  else {
    const pct = Math.round(t.pct || 0);
    const label = STATUS_LABEL[t.status] || t.status;
    add("Status:", pct > 0 && pct < 100 ? `${label} (${pct}%)` : label);
  }
  // Formatting is dropped — bullets survive as "• ", colors and fonts don't.
  const notes = bodyText(t).trim();
  return [t.subject || "(No subject)", "", ...rows].join("\n") + (notes ? "\n\n" + notes : "");
}

const icsEscape = v => String(v).replace(/\\/g,"\\\\").replace(/;/g,"\\;")
  .replace(/,/g,"\\,").replace(/\n/g,"\\n");
/* UTC per RFC 5545 — a floating local time would shift the due date for a
   recipient in another timezone. */
const icsStamp = d => new Date(d).toISOString().replace(/[-:]/g,"").replace(/\.\d{3}/,"");

function icsFor(t){
  const L = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Task Perfect//EN",
             "CALSCALE:GREGORIAN","BEGIN:VTODO",
             "UID:task-" + t.id + "@taskperfect",
             "DTSTAMP:" + icsStamp(new Date()),
             "SUMMARY:" + icsEscape(t.subject || "")];
  if(t.due) L.push("DUE:" + icsStamp(t.due));
  if(t.start) L.push("DTSTART:" + icsStamp(t.start));
  if(t.categories.length) L.push("CATEGORIES:" + t.categories.map(icsEscape).join(","));
  const notes = bodyText(t).trim();
  if(notes) L.push("DESCRIPTION:" + icsEscape(notes));
  if(t.importance === "High") L.push("PRIORITY:1");
  if(t.importance === "Low")  L.push("PRIORITY:9");
  L.push("PERCENT-COMPLETE:" + Math.round(t.pct || 0));
  L.push("STATUS:" + (isDone(t) ? "COMPLETED" : "NEEDS-ACTION"));
  if(isDone(t) && t.completed) L.push("COMPLETED:" + icsStamp(t.completed));
  L.push("END:VTODO","END:VCALENDAR");
  // CRLF, not LF: RFC 5545 requires it and Outlook is strict where Apple is not.
  return L.join("\r\n");
}

let sharePayload = null;

el("shareBtn").onclick = async () => {
  if(!editing) return;
  const text = shareText(editing);
  const name = (editing.subject || "Task").replace(/[^\w \-]/g,"").trim().slice(0,40) || "Task";
  const ics = icsFor(editing);
  sharePayload = { text, ics, name };

  // The real share sheet on a phone. On desktop there isn't one, so show what
  // would be sent rather than downloading a file silently and looking broken.
  try {
    const file = new File([ics], name + ".ics", {type:"text/calendar"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({title: editing.subject, text, files:[file]});
      return;
    }
    if(navigator.share){ await navigator.share({title: editing.subject, text}); return }
  } catch(err) {
    // Cancelling is not a failure; anything else falls through to the preview
    // rather than being swallowed, which is what made this look like nothing
    // had happened at all.
    if(err && err.name === "AbortError") return;
  }
  openSharePreview();
};

/* Text and number fields update state silently — a re-render here would
   steal focus mid-word. Only structural changes rebuild the sheet. */

   stored and then rendered as a space anyway, so swallow it. */

el("sheetBody").addEventListener("input", e => {
  if(!editing) return;
  const t = e.target;

  // contenteditable has no value, so it can't ride the data-f path below.
  if(t.dataset && t.dataset.f === "notesrich"){ editing.notes = t.innerHTML; return }
  if(t.dataset && t.dataset.f === "subject") growSubject(t);

  if(t.id==="f_pct"){
    setPct(editing, +t.value);
    el("pctLabel").textContent = Math.round(editing.pct)+"%";
    const sel = document.querySelector('#sheetBody [data-f="status"]');
    if(sel) sel.value = editing.status;
    return;
  }
  const f = t.dataset.f; if(!f) return;
  if(f==="totalWork"||f==="actualWork") editing[f] = t.value?+t.value:null;
  else if(f==="start"||f==="due"){
    const h = String(t.dataset.hour||17).padStart(2,"0");
    editing[f] = t.value ? new Date(`${t.value}T${h}:00:00`) : null;
  }
  else if(f==="remindAt"){ editing[f] = t.value?new Date(t.value):null;
    editing.reminder = editing.remindAt != null; }
  // Companies is an array in EWS; the generic branch below would store a string
  // and the field would come back mangled after a save.
  else if(f==="assigned"){
    editing.companies = t.value.split(",").map(x=>x.trim()).filter(Boolean);
  }
  else editing[f] = t.value||null;

});

/* execCommand is deprecated but is still the only thing every mobile browser
   implements for contenteditable, and this is a prototype — the Swift build
   uses NSAttributedString and doesn't share this constraint. */
el("sheetBody").addEventListener("mousedown", e => {
  // Keep focus in the note; a toolbar button stealing it loses the selection
  // the command is meant to act on.
  if(e.target.closest(".notebar button")) e.preventDefault();
});



/* Click-only: date rows, quick picks, recurrence, categories, delete. These
   were folded into the change listener by a bad merge, which meant tapping a
   date row did nothing — a change event never fires for a div. */
/* One click listener for the whole sheet. Two of them is how the date rows got
   lost last time: a second registration is easy to merge wrongly, and easy to
   miss when reading. */
el("sheetBody").addEventListener("click", e => {
  if(!editing) return;
  const tg = e.target.closest("[data-notehtml]");
  if(tg){
    if(isHtmlBody(editing)){
      // Lossy: a plain body cannot hold bullets or color, so this discards them
      // rather than hiding them. Worth asking.
      askConfirm({
        title:"Switch to plain text?",
        message:"Formatting in this note — colors, fonts, bullets and numbering — will be removed. The words are kept.",
        actionLabel:"Remove Formatting", destructive:true,
        onConfirm:()=>{
          editing.notes = bodyText(editing);
          editing.bodyType = "Text";
          renderSheet();
        }
      });
    } else {
      // Safe direction: nothing is lost turning plain text into HTML.
      editing.notes = plainToHtml(editing.notes);
      editing.bodyType = "HTML";
      renderSheet();
    }
    return;
  }

  const em = e.target.closest("[data-emph]");
  if(em){
    const k = em.dataset.emph;
    const cur = emphasisOf(editing);
    if(k === "reset"){
      // Clears all three. The user can re-set whichever they wanted — simpler
      // than three separate resets for something done rarely.
      setMileage(editing, {emphasis:{bold:null, italic:null, size:null}});
    } else if(k === "size+" || k === "size-"){
      const step = k === "size+" ? 1 : -1;
      if(cur.size === null){
        // First press adopts the category's own size, so stepping from
        // "Category" moves one notch rather than jumping to zero.
        cur.size = styleForTask(editing).sizeDelta + step;
      } else {
        cur.size = cur.size + step;
      }
      // Below the floor, fall back to the category rather than clamping — it
      // gives the stepper a way back to the third state.
      if(cur.size < -3) cur.size = null;
      else if(cur.size > 4) cur.size = 4;
      setMileage(editing, {emphasis:cur});
    } else {
      // unset → on → off → unset. Three stops, because a two-state control
      // can't say "follow the category".
      cur[k] = cur[k] === null ? true : (cur[k] === true ? false : null);
      setMileage(editing, {emphasis:cur});
    }
    renderSheet();
    return;
  }

  const b = e.target.closest("[data-note]");
  if(b && b.tagName === "BUTTON"){
    document.execCommand(b.dataset.note, false, null);
    const field = el("sheetBody").querySelector('[data-f="notesrich"]');
    if(field){ editing.notes = field.innerHTML; field.focus() }
  }
  if(e.target.closest("#openTaskCats")){ openTaskCategories(); return }
  if(e.target.closest("#recRow")){ openRec(); return }

  if(e.target.closest("#doneRow")){
    // Same path as tapping the circle in the list, so the completion
    // confirmation toggle in Settings governs this too without a second
    // implementation of the same rule.
    const id = editing.id;
    closeSheet();
    requestToggle(id);
    return;
  }
  if(e.target.closest("#delRow")){
    if(settings.confirmTaskDelete) askDelete(editing.id); else doDelete(editing.id);
    return;
  }

  const q = e.target.closest("[data-quick]");
  if(q){
    const f = q.dataset.quick, hour = +q.dataset.hour;
    editing[f] = q.dataset.days === "" ? null : seedDate(+q.dataset.days, hour);
    if(f==="remindAt") editing.reminder = editing.remindAt != null;
    renderSheet();
    return;
  }

  const dr = e.target.closest("[data-drow]");
  if(dr){
    openDate = openDate===dr.dataset.drow ? null : dr.dataset.drow;
    renderSheet();
    return;
  }

});

el("sheetBody").addEventListener("change", e => {
  const sel = e.target.closest("[data-note]");
  if(sel && sel.tagName === "SELECT"){
    const cmd = sel.dataset.note;
    const val = cmd === "fontName" ? DESIGNS[sel.value] : sel.value;
    document.execCommand(cmd, false, val);
    const field = el("sheetBody").querySelector('[data-f="notesrich"]');
    if(field){ editing.notes = field.innerHTML; field.focus() }
    return;
  }
  if(!editing) return;
  const f = e.target.dataset.f; if(!f) return;
  if(f==="status"){
    setStatus(editing, e.target.value);
    renderSheet();                      // % and completed-date both move
  } else if(f==="importance"){
    editing.importance = e.target.value;
  } else if(f==="start"||f==="due"){
    const h = String(e.target.dataset.hour||17).padStart(2,"0");
    editing[f] = e.target.value ? new Date(`${e.target.value}T${h}:00:00`) : null;
    renderSheet();   // the row label and recurrence preview both depend on it
  }

});



/* ================= RECURRENCE EDITOR ================= */
let recDraft = null, recAnchor = null;

function openRec(){
  recAnchor = editing.due ? new Date(editing.due) : new Date();
  recDraft = editing.rec
    ? JSON.parse(JSON.stringify(editing.rec))
    : {freq:"Weekly",interval:1,days:[DAYS[recAnchor.getDay()]],mode:"day",
       dayOfMonth:recAnchor.getDate(),ordinal:"First",weekday:DAYS[recAnchor.getDay()],
       month:recAnchor.getMonth()+1,regen:false,end:{mode:"never",count:10}};
  recDraft.on = !!editing.rec;
  recDraft.start = recAnchor;
  renderRec();
  el("rec").classList.add("open");
}
function closeRec(){ el("rec").classList.remove("open") }

function renderRec(){
  const r = recDraft;
  const u = UNIT[r.freq];
  const endD = r.end.date ? new Date(r.end.date) : new Date(recAnchor.getFullYear()+1,recAnchor.getMonth(),recAnchor.getDate());

  let html = `<div class="group"><div class="frow"><span class="k">Repeat this task</span>
    <div class="toggle ${r.on?"on":""}" data-rec="on"><i></i></div></div></div>`;

  if(r.on){
    html += `<div class="glabel">FREQUENCY</div><div class="group">
      <div class="frow" style="padding:8px 10px"><div class="seg" style="width:100%">
        ${["Daily","Weekly","Monthly","Yearly"].map(f=>`<button data-freq="${f}" class="${r.freq===f?"on":""}">${f}</button>`).join("")}
      </div></div>`;
    if(r.freq!=="Yearly"){
      html += `<div class="frow"><span class="k">Every</span><div class="step">
        <button data-int="-1">−</button>
        <span class="num" style="min-width:74px;text-align:center;color:var(--slate)">${r.interval===1?u:r.interval+" "+u+"s"}</span>
        <button data-int="1">+</button></div></div>`;
    }
    html += `</div>`;

    if(r.freq==="Weekly"){
      html += `<div class="glabel">ON THESE DAYS</div><div class="group"><div class="daypick">
        ${DAYS.map(d=>`<button data-day="${d}" class="${(r.days||[]).includes(d)?"on":""}">${d[0]}</button>`).join("")}
      </div>${(r.days||[]).length?"":'<div class="hint" style="padding:0 14px 12px">Pick at least one day.</div>'}</div>`;
    }

    if(r.freq==="Monthly"||r.freq==="Yearly"){
      html += `<div class="glabel">${r.freq==="Yearly"?"WHEN":"ON"}</div><div class="group">`;
      if(r.freq==="Yearly"){
        html += `<div class="frow"><span class="k">Month</span>
          <select data-sel="month">${MONTHS.map((m,i)=>`<option value="${i+1}" ${r.month===i+1?"selected":""}>${m}</option>`).join("")}</select></div>`;
      }
      html += `<div class="frow" style="padding:8px 10px"><div class="seg" style="width:100%">
        <button data-mode="day" class="${r.mode==="day"?"on":""}">On a day</button>
        <button data-mode="weekday" class="${r.mode==="weekday"?"on":""}">On a weekday</button>
      </div></div>`;
      if(r.mode==="day"){
        html += `<div class="frow"><span class="k">Day of month</span><div class="step">
          <button data-dom="-1">−</button>
          <span class="num" style="min-width:30px;text-align:center;color:var(--slate)">${r.dayOfMonth}</span>
          <button data-dom="1">+</button></div></div>`;
        if(r.dayOfMonth>28) html += `<div class="hint" style="padding:0 14px 12px">Short months use their last day.</div>`;
      } else {
        html += `<div class="frow"><span class="k">Which</span>
          <select data-sel="ordinal">${ORDINALS.map(o=>`<option ${r.ordinal===o?"selected":""}>${o}</option>`).join("")}</select></div>
          <div class="frow"><span class="k">Day</span>
          <select data-sel="weekday">${DAYS.map(d=>`<option value="${d}" ${r.weekday===d?"selected":""}>${DAYFULL[d]}</option>`).join("")}</select></div>`;
      }
      html += `</div>`;
    }

    html += `<div class="group"><div class="frow"><span class="k">Count from completion</span>
      <div class="toggle ${r.regen?"on":""}" data-rec="regen"><i></i></div></div></div>
      <div class="hint" style="margin:-12px 0 18px 6px">${r.regen
        ? `The next task appears ${r.interval} ${u}${r.interval===1?"":"s"} after you finish this one — useful when falling behind shouldn't stack up overdue copies.`
        : "The schedule is fixed. Finishing late doesn't move the next due date."}</div>`;

    html += `<div class="glabel">ENDS</div><div class="group">
      <div class="frow" style="padding:8px 10px"><div class="seg" style="width:100%">
        ${[["never","Never"],["after","After"],["on","On date"]].map(([k,lbl])=>
          `<button data-end="${k}" class="${r.end.mode===k?"on":""}">${lbl}</button>`).join("")}
      </div></div>`;
    if(r.end.mode==="after"){
      html += `<div class="frow"><span class="k">Occurrences</span><div class="step">
        <button data-occ="-1">−</button>
        <span class="num" style="min-width:30px;text-align:center;color:var(--slate)">${r.end.count||10}</span>
        <button data-occ="1">+</button></div></div>`;
    } else if(r.end.mode==="on"){
      html += `<div class="frow"><span class="k">Last date</span>
        <input type="date" data-sel="enddate" value="${endD.toISOString().slice(0,10)}" style="color:var(--slate);border:0;font-family:inherit;font-size:15px;background:transparent"></div>`;
    }
    html += `</div>`;

    const dates = upcoming(recAnchor, r, 4);
    html += `<div class="glabel">NEXT OCCURRENCES</div><div class="group preview">`;
    html += dates.length
      ? dates.map((dt,i)=>`<div>${dt.toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}${i===0?' <span style="float:right;font-size:12px">next</span>':""}</div>`).join("")
      : `<div style="color:var(--overdue)">This pattern produces no further dates.</div>`;
    html += `</div>`;
    if(r.regen && dates.length) html += `<div class="hint" style="margin:-12px 0 18px 6px">Estimated — regenerating tasks depend on when each one is completed.</div>`;
  }

  el("recBody").innerHTML = html;
}

el("recBody").addEventListener("click", e => {
  const r = recDraft; if(!r) return;
  const t = e.target;
  const g = sel => t.closest(`[${sel}]`);
  if(g("data-rec")){ const k=g("data-rec").dataset.rec; r[k]=!r[k]; renderRec(); return }
  if(g("data-freq")){ r.freq=g("data-freq").dataset.freq; renderRec(); return }
  if(g("data-int")){ r.interval=Math.max(1,Math.min(99,r.interval+ +g("data-int").dataset.int)); renderRec(); return }
  if(g("data-day")){ const d=g("data-day").dataset.day; r.days=r.days||[];
    const i=r.days.indexOf(d); i>=0?r.days.splice(i,1):r.days.push(d); renderRec(); return }
  if(g("data-mode")){ r.mode=g("data-mode").dataset.mode; renderRec(); return }
  if(g("data-dom")){ r.dayOfMonth=Math.max(1,Math.min(31,r.dayOfMonth+ +g("data-dom").dataset.dom)); renderRec(); return }
  if(g("data-end")){ r.end.mode=g("data-end").dataset.end; if(!r.end.count)r.end.count=10; renderRec(); return }
  if(g("data-occ")){ r.end.count=Math.max(2,Math.min(365,(r.end.count||10)+ +g("data-occ").dataset.occ)); renderRec(); return }
});
el("recBody").addEventListener("change", e => {
  const r = recDraft; if(!r) return;
  const k = e.target.dataset.sel; if(!k) return;
  if(k==="month") r.month=+e.target.value;
  else if(k==="ordinal") r.ordinal=e.target.value;
  else if(k==="weekday") r.weekday=e.target.value;
  else if(k==="enddate") r.end.date=new Date(e.target.value+"T12:00:00");
  renderRec();
});
el("recBack").onclick = closeRec;
el("recDone").onclick = () => {
  editing.rec = recDraft.on ? recDraft : null;
  closeRec();
  renderSheet();
};

el("saveBtn").onclick = () => {
  if(!editing) return;

  if(isNewTask){
    const subject = (editing.subject||"").trim();
    if(!subject){ toast("Give the task a subject"); return }
    editing.subject = subject;
    editing.dirty = true;
    const added = editing;
    tasks.push(added);
    enqueueChange("create", added.id);
    closeSheet();
    // A new task that doesn't belong to the tab you're on would vanish on save.
    // Land somewhere it's actually visible instead.
    const visibleHere = (activeTab==="all" ? visible("all")
      : activeTab==="today" ? todayTasks()
      : activeTab==="overdue" ? overdueTasks()
      : activeTab==="nodue" ? undatedTasks()
      : completedTasks()).some(t=>t.id===added.id);
    if(!visibleHere){ activeTab = "all"; toast("Added to All Tasks") } else { toast("Task added") }
    renderList(); scheduleAutoSync();
    setTimeout(()=>{ added.dirty=false; renderList() }, 700);
    return;
  }

  const i = tasks.findIndex(t=>t.id===editing.id);
  // Every field already wrote itself into `editing` as it was typed, so there
  // is nothing to scrape out of the DOM here.
  editing.dirty = true;
  enqueueChange("update", editing.id);
  tasks[i] = editing;
  closeSheet(); renderList(); scheduleAutoSync();
  toast("Saved — will sync");
};

} catch(err) {
  const box = document.getElementById("fatal");
  if(box){
    box.style.display = "block";
    box.textContent = "Startup failed: " + (err && err.message ? err.message : String(err))
      + (err && err.lineNumber ? " (line " + err.lineNumber + ")" : "");
  }
}
</script>
</body>
</html>
