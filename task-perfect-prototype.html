<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Perfect — Prototype</title>
<style>
  :root{
    --ink:#16283D; --slate:#6B7280; --hairline:#E3E5E9;
    --paper:#FFFFFF; --canvas:#F2F3F5; --overdue:#C0392B; --flag:#E08A1E; --navy:#14396E;
    /* ~3% red over white — enough to register while scanning, not enough to
       fight the bold red subject already carrying the signal. */
    --overdue-wash:#FBEAE8;
    /* Matching wash for undated rows, keyed to the navy section heading. */
    --undated-wash:#E8EDF7;
    --spine:4px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* dvh, not %. On mobile Safari a percentage height resolves against the
     layout viewport, which is taller than the visible area because of the
     address bar — so the device box overflowed and the centring below clipped
     its top and bottom with no way to scroll to either. */
  html,body{margin:0;padding:0;min-height:100dvh}
  @supports not (min-height: 100dvh){ html,body{min-height:100vh} }
  body{
    font:400 16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:#0E1620; color:var(--ink);
    display:flex; justify-content:center;
    /* Auto margins on the frame centre it when there's room and let the page
       scroll when there isn't. `align-items:center` clips both ends instead,
       which is what made the top of a sheet unreachable. */
    overflow:auto;
    /* The frame is sized to the window, so the page should never need to
       scroll. Pinning it here stops a focused input dragging the whole page
       up and stranding the top of a sheet above the fold. */
    overscroll-behavior:none;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* Device frame on wide screens, full-bleed on a phone */
  .device{
    width:100%; max-width:420px;
    /* Never taller than the visible area — including when the keyboard is up.
       Subtracting --kbd is what stops the *document* scrolling: with the frame
       fitting exactly, there is nothing off-screen for iOS to scroll to when it
       reveals a focused field, so the sheet header with Cancel and Save can no
       longer be pushed under the browser chrome. */
    height:calc(100dvh - var(--kbd, 0px));
    margin:auto;
    background:var(--canvas); position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  @supports not (height: 100dvh){ .device{height:100vh} }
  @media (min-width:520px) and (min-height:720px){
    .device{
      border-radius:38px; box-shadow:0 24px 70px rgba(0,0,0,.55);
      /* min() keeps the phone frame from ever exceeding the window. */
      height:min(860px, calc(100dvh - 40px - var(--kbd, 0px)));
    }
  }

  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas);overflow:hidden}
  .hidden{display:none}

  /* ---------- Sign in ---------- */
  /* Auto margins centre the content but still let it scroll when it grows —
     `justify-content:center` clips both ends once the content overflows, which
     is what pushed the username field off-screen when the server fields
     appeared. */
  .signin{align-items:center;padding:24px;text-align:center;overflow-y:auto}
  .signin > .signin-inner{margin:auto 0;width:100%;display:flex;flex-direction:column;
    align-items:center}
  .signin h1{font-size:30px;font-weight:600;margin:0}
  .signin .brand{margin:0 0 6px}
  .signin .sub{color:var(--slate);font-size:15px;margin:0 0 36px}
  .fieldgroup{width:100%;background:var(--paper);border:1px solid var(--hairline);border-radius:10px;overflow:hidden}
  .fieldgroup input{width:100%;border:0;padding:16px;font-size:16px;outline:none;background:transparent;font-family:inherit}
  .fieldgroup input+input{border-top:1px solid var(--hairline)}
  .signin .note{color:var(--slate);font-size:12px;margin-top:10px}
  .signin button.linkish{background:none;border:0;font-family:inherit;cursor:pointer;padding:0}
  /* Right-aligned so the value reads as an editable field, not a heading. */
  .inlineinput{border:0;background:none;font:inherit;font-size:15px;color:var(--slate);
    text-align:right;flex:1;min-width:0;outline:none;padding:0}
  .btn-primary{
    width:100%;margin-top:20px;min-height:48px;border:0;border-radius:10px;
    background:var(--ink);color:#fff;font-size:16px;font-weight:600;font-family:inherit;cursor:pointer;
  }
  .btn-primary:disabled{opacity:.35}
  /* In flow beneath Sign in, not pinned to the bottom of the screen. Pinned, it
     sat below the fold in any short viewport — under the browser toolbar on a
     phone — with nothing to say it was there. */
  .demo{margin-top:18px;background:none;border:0;color:var(--slate);font-size:15px;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:center}

  /* ---------- Nav bar ---------- */
  .nav{
    background:var(--paper);border-bottom:1px solid var(--hairline);
    padding:12px 12px 10px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px;
  }
  .navleft{display:flex;align-items:center}
  #syncBtn.spinning{opacity:.4;pointer-events:none}
  .nav button{background:none;border:0;font-size:19px;color:var(--ink);cursor:pointer;padding:8px;font-family:inherit}
  .nav .title{display:flex;align-items:center;justify-content:center;gap:7px}
  .nav .title .titletext{text-align:center}
  .nav .title strong{display:block;font-size:17px;font-weight:600}
  .nav .title .titletext span{display:block;font-size:11px;color:var(--slate);margin-top:1px}
  /* overflow:visible keeps the long stroke from being clipped where it leaves
     the disc — the whole point of the mark. */
  .mark{width:36px;height:36px;flex:0 0 36px;overflow:visible}
  .mark.big{width:58px;height:58px;flex:0 0 58px}
  .brand{display:flex;align-items:center;justify-content:center;gap:12px}
  /* Home-screen icon preview, so the badge can actually be seen — a browser
     can't set a real app icon badge. */
  .iconpreview{position:relative;display:inline-flex;align-items:center;justify-content:center;
    width:68px;height:68px;border-radius:16px;background:var(--paper);
    border:1px solid var(--hairline);box-shadow:0 2px 8px rgba(0,0,0,.10)}
  .iconpreview svg{width:46px;height:46px;overflow:visible}
  .iconbadge{position:absolute;top:-7px;right:-7px;min-width:24px;height:24px;padding:0 6px;
    border-radius:99px;background:#FF3B30;color:#fff;font-size:13px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--canvas);font-variant-numeric:tabular-nums}
  .nav .title span.od{color:var(--overdue)}
  .nav .title .titletext span.off{color:var(--flag)}
  .filter-on{color:var(--ink)}
  /* Centered to sit on the same axis as the app title above it, rather than
     starting a second alignment against the search field's left edge. */
  .tabname{background:var(--paper);padding:2px 14px 6px;font-size:11px;font-weight:600;
    letter-spacing:.7px;text-transform:uppercase;color:var(--slate);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .searchwrap{background:var(--paper);padding:0 12px 10px;border-bottom:1px solid var(--hairline)}
  .searchfield{position:relative;display:flex;align-items:center}
  .searchwrap input{
    width:100%;border:0;background:var(--canvas);border-radius:9px;padding:9px 12px;
    font-size:15px;outline:none;font-family:inherit;
  }
  .searchwrap input:not(:placeholder-shown){padding-right:38px}
  #clearSearch{
    position:absolute;right:6px;width:26px;height:26px;border:0;border-radius:50%;
    background:var(--hairline);color:var(--slate);font-size:13px;line-height:1;
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }

  /* ---------- List ---------- */
  /* Same min-height:0 requirement as the sheet body. */
  /* No -webkit-overflow-scrolling:touch. On iOS it puts the scroller on a
     separate compositor layer that doesn't repaint when its contents are
     replaced while the keyboard is up — so typing in the search box redrew the
     list but only the first section appeared, and leaving the tab and coming
     back (a layout event) revealed the rest. Momentum scrolling has been the
     default since iOS 13; the flag bought nothing and cost this. */
  /* `isolation:isolate` is load-bearing, not decoration. Task rows carry
     z-index:1 for the swipe track, and this keeps that number inside the list
     where it belongs. It used to be contained by accident: the
     -webkit-overflow-scrolling flag promoted the list to its own layer. Removing
     that flag (it was breaking the list's height on iOS) let the rows' z-index
     escape into the page, where it painted them above the task sheet — opening a
     task showed the sheet *behind* the list. */
  .list{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;isolation:isolate;
    padding:8px 12px 40px;overscroll-behavior-x:none}
  .sec-head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:18px 6px 7px;font-size:12px;font-weight:700;letter-spacing:.6px;color:#000;
  }
  .sec-head.od{color:var(--overdue)}
  .sec-head.collapsible{cursor:pointer;-webkit-user-select:none;user-select:none}
  /* Rotates rather than swapping glyphs, so the direction of travel is obvious
     and the header doesn't reflow by a pixel when it turns. */
  .chev{display:inline-block;margin-right:6px;font-size:10px;transition:transform .15s;
    transform:rotate(0deg)}
  .chev.shut{transform:rotate(-90deg)}
  .sec-head.nodate{color:var(--navy)}
  /* Overdue keeps its accent on the count, not the heading, so the urgency
     signal survives the black text. */
  .sec-head .num{color:var(--slate);font-weight:600}
  .sec-head.od .num{color:var(--overdue)}
  .card{background:var(--paper);border-radius:10px;overflow:hidden;border:1px solid var(--hairline)}
  /* Grid, not flex. Column tracks are declared, so the subject always starts at
     exactly the same x whether or not the row has categories, a flag, or a
     sync marker. A flex chain lets any of those nudge the text. */
  .row{display:grid;grid-template-columns:var(--spine) 23px 1fr auto;gap:12px;
       align-items:start;padding:11px 14px 11px 10px;cursor:pointer;position:relative}
  /* Each row rides in a clipping track so it can slide left over a Delete
     action parked underneath. */
  .rowwrap{position:relative;overflow:hidden;background:var(--paper)}
  .rowwrap+.rowwrap{border-top:1px solid var(--hairline)}
  /* Overdue rows get a barely-there red wash. Both the wrapper and the row are
     tinted: the row sits above the swipe track, so tinting only one leaves a
     mismatched sliver as the row slides. */
  .rowwrap.late, .rowwrap.late .row{background:var(--overdue-wash)}
  .rowwrap.undated, .rowwrap.undated .row{background:var(--undated-wash)}
  .rowwrap .row{background:var(--paper);position:relative;z-index:1;
    transition:transform .18s cubic-bezier(.32,.72,0,1);touch-action:pan-y}
  .rowwrap.open .row{transform:translateX(-92px)}
  .swipeact{position:absolute;top:0;right:0;bottom:0;width:92px;border:0;
    background:var(--overdue);color:#fff;font:600 14px/1 inherit;font-family:inherit;
    cursor:pointer;display:flex;align-items:center;justify-content:center}
  .row:active{background:#FAFAFB}

  .spine{align-self:stretch;min-height:34px;border-radius:99px;display:flex;flex-direction:column;overflow:hidden}
  .spine i{flex:1;display:block}
  .spine.empty{background:transparent}

  .check{
    width:23px;height:23px;border-radius:50%;border:1.5px solid var(--slate);
    background:none;cursor:pointer;padding:0;margin-top:1px;position:relative;
  }
  .check.done{background:var(--ink);border-color:var(--ink)}
  .check.done::after{
    content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);
  }
  .rowbody{min-width:0}
  /* Plain block, not a flex row. Anything placed beside the text in here shifts
     its left edge and rows stop sharing a margin. Markers go in the right gutter. */
  /* Matches BASE_SIZE. A completed row renders with no inline style, so if
     these two disagree the struck-through rows sit at a different size. */
  .subj{font-size:15px;line-height:1.3;text-align:left;
    display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;
    -webkit-line-clamp:var(--subjlines,2);line-clamp:var(--subjlines,2)}
  .subj.done{color:var(--slate);text-decoration:line-through}
  .gutter{display:flex;flex-direction:column;align-items:flex-end;gap:4px;margin-top:2px;min-width:0}
  .bang{color:var(--flag);font-weight:800;font-size:15px;line-height:1}
  .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;font-size:12px;color:var(--slate)}
  .meta .od{color:var(--overdue)}
  .bar{height:3px;background:var(--hairline);border-radius:99px;max-width:120px;margin-top:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ink)}
  .dirty{color:var(--slate);font-size:12px}
  .rowfoot{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:3px}
  .donedate{text-align:right;font-size:11px;color:var(--slate);
    font-variant-numeric:tabular-nums;flex:0 0 auto}
  /* Slate with a small figure, so a name doesn't read as another category —
     they sit inches apart and would otherwise look alike. */
  .assignee{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--slate);
    min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .assignee svg{width:11px;height:11px;flex:0 0 auto;fill:none;
    stroke:var(--slate);stroke-width:1.6;stroke-linecap:round}
  .note{display:flex;align-items:center;padding:12px 14px;cursor:pointer;font-size:13px;color:var(--slate)}

  .empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 40px;text-align:center}
  .empty h3{margin:0;font-size:17px}
  .empty p{margin:0;color:var(--slate);font-size:14px}

  /* ---------- Sheet ---------- */
  /* Explicit, so nothing here is decided by where an element happens to sit in
     the markup. The scale: rows live inside the list's own context · popscrim 4 ·
     pop 5 · task scrim and sheet 6 · pushed panels 7–11 · undo 10 · dialogs 20+.
     The sheet must sit above the list and below the panels it pushes. */
  .scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .22s;z-index:6}
  .scrim.open{opacity:1;pointer-events:auto}
  /* Full height, not a card inset from the top. A task editor is where real
     time is spent and a long note needs the room; the 44px strip only showed
     the header of the screen behind, which read as the sheet failing to open
     rather than as a deliberate affordance. */
  .sheet{
    position:absolute;left:0;right:0;bottom:0;top:0;background:var(--canvas);z-index:6;
    border-radius:0;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;overflow:hidden;
  }
  .sheet.open{transform:translateY(0)}
  .sheet-nav{background:var(--paper);border-bottom:1px solid var(--hairline);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .sheet-nav button{background:none;border:0;font-size:16px;color:var(--ink);font-family:inherit;cursor:pointer;padding:0}
  #shareBtn{font-size:19px;line-height:1}
  .sharepre{margin:0;font:inherit;font-size:12px;line-height:1.45;white-space:pre-wrap;
    word-break:break-word;color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .sheet-nav .save{font-weight:600}
  /* min-height:0 is the important part. A flex item defaults to min-height:auto,
     which refuses to shrink below its content — so `overflow-y:auto` never
     engages and the body grows past the sheet instead of scrolling, pushing its
     own top out of view. This is why the form opened showing its bottom with no
     way to scroll up. */
  /* Matches the single-line inputs around it, but wraps and grows. */
  /* `.frow textarea` sets min-height:80px for the notes field, and at
     specificity (0,1,1) it outranks a bare class — so this selector has to match
     it or the subject keeps opening four lines tall for one line of text. */
  .frow textarea.subjectinput{
    width:100%;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);
    resize:none;outline:none;padding:0;margin:0;line-height:1.35;
    min-height:0;height:auto;overflow:hidden;text-align:left;font-family:inherit;
  }
  /* The bottom padding grows while the keyboard is up. Without somewhere to
     scroll to, the browser clamps the scroll position part-way and the top of
     the form can't be reached until the keyboard is dismissed. */
  .sheet-body{flex:1;min-height:0;overflow-y:auto;
    overscroll-behavior:contain;padding:14px 12px 40px}
  .group{background:var(--paper);border:1px solid var(--hairline);border-radius:10px;margin-bottom:18px;overflow:hidden}
  /* Group headers. Larger and darker than the section labels beneath them, on a
     tinted band that runs edge to edge — so the eye can find the five groups
     without reading every row. The band is what separates them; a heavier font
     alone reads as just another label. */
  .ghead{
    display:block;margin:26px -16px 10px;padding:12px 16px 11px;
    background:linear-gradient(180deg,#EEF1F6 0%,#E9EDF4 100%);
    border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  }
  .sheet-body > .ghead:first-child{margin-top:4px}
  .ghead-title{display:block;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
  .ghead-sub{display:block;font-size:12px;color:var(--slate);margin-top:2px}
  .glabel{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--slate);padding:0 6px 7px}
  .frow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;font-size:15px}
  .frow+.frow{border-top:1px solid var(--hairline)}
  .frow .k{color:var(--ink)}
  .frow .v{color:var(--slate);text-align:right}
  .frow input[type=text],.frow input[type=number]{border:0;outline:none;text-align:right;font-size:15px;font-family:inherit;background:transparent;color:var(--slate);width:130px}
  .frow select{border:0;background:transparent;font-size:15px;font-family:inherit;color:var(--slate);text-align:right;outline:none;direction:rtl}
  .frow textarea{border:0;outline:none;width:100%;font:inherit;font-size:15px;resize:vertical;min-height:80px;background:transparent}
  input[type=range]{width:100%;accent-color:var(--ink)}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--hairline);border-radius:99px;padding:5px 10px;font-size:14px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 8px;border:1px solid transparent}
  .dot.none{border-color:var(--hairline);background:#fff}
  .catrow{display:flex;justify-content:space-between;align-items:center;padding:9px 14px;cursor:pointer}
  .catrow+.catrow{border-top:1px solid var(--hairline)}
  .tick{color:var(--ink);font-weight:700}
  .orphan{font-size:12px;color:var(--slate)}
  /* Wraps rather than scrolling: a task with several categories should show
     them all, and the row is free to grow. */
  .catchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;flex:1;min-width:0}
  .catchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);
    background:var(--canvas);border-radius:99px;padding:3px 9px;white-space:nowrap}
  /* The first one decides where the task files under category grouping, so it
     shouldn't look interchangeable with the rest. */
  .catchips .catchip:first-child{font-weight:600}
  .catchip.orphanchip{opacity:.75}


/* ---------- Filter popover ---------- */
  /* Anchored below the nav, search field and pill tabs — the offset has to move
     whenever anything above it changes height. */
  .pop{
    position:absolute;top:150px;left:10px;right:10px;background:var(--paper);
    border:1px solid var(--hairline);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.16);
    z-index:5;overflow:hidden;display:none;
  }
  .pop.open{display:block}
  /* Without this the panel's bottom edge sits flush against live task rows, and
     the whole thing reads as one continuous surface — filter chips, a settings
     line, then tasks you could apparently tap. The dim says "this is temporary,
     the list is waiting underneath". */
  .popscrim{position:absolute;inset:0;background:rgba(16,24,40,.28);z-index:4;display:none}
  .popscrim.open{display:block}
  /* The panel covers the list, so it needs a way out that isn't "remember to
     scroll back up and tap the hamburger again". */
  /* Larger than the section labels in Settings, and its own class — so this
     doesn't move them. Tracking is eased back from .6 to .3: wide letter-spacing
     buys legibility at 11px, but at 13px it just reads as stretched. */
  .pophead{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 5px 14px;font-size:13px;font-weight:600;letter-spacing:.3px;
    color:var(--slate)}
  /* Matches .pophead, so the panel's two non-row lines read as a pair. The
     chevron beside it is what still says "tappable" — grey uppercase alone
     would read as a label. */
  .poplink{font-size:13px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;
    color:var(--slate)}
  .pophead button{border:0;background:none;color:var(--slate);font-size:15px;
    line-height:1;cursor:pointer;padding:6px 8px}
  .pop .catrow{padding:11px 14px}
  /* Tinted and divided: everything above filters the list, this leaves it. Same
     weight and background made it read as one more category. */
  .pop .foot{border-top:1px solid var(--hairline);padding:11px 14px;display:flex;justify-content:space-between;align-items:center;font-size:15px}
  .pop .settingsfoot{background:var(--canvas)}
  .pop .foot button{background:none;border:0;color:var(--ink);font-family:inherit;font-size:15px;cursor:pointer;padding:0}
  /* Bold black rather than the ink navy: this is the way out of a filter menu
     into everything else, so it shouldn't read as just another row. */
  .pop .foot button#openSettings{color:#000;font-weight:700;font-size:17px;
    display:flex;align-items:center;gap:9px}
  /* Extra air above, so it reads as the way out rather than the last row of
     the category list. */
  .pop .foot.settingsfoot{padding-top:16px}
  .gear{width:19px;height:19px;flex:0 0 auto;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .toggle{width:44px;height:26px;border-radius:99px;background:var(--hairline);position:relative;cursor:pointer;transition:background .18s;flex:0 0 44px}
  .toggle.on{background:var(--ink)}
  /* Shown but visibly inert, so it answers "why can't I change this?" itself. */
  .toggle.locked{opacity:.32;pointer-events:none}
  .colhead{display:flex;align-items:flex-end;padding:0 14px 4px;font-size:10px;
    color:var(--slate);text-transform:uppercase;letter-spacing:.04em}
  .colhead span:first-child{flex:1}
  .colhead span:not(:first-child){width:56px;text-align:center;line-height:1.15}
  .frow.tworow{gap:0}
  .frow.tworow .k{flex:1;min-width:0}
  .frow.tworow .cell{width:56px;display:flex;justify-content:center;flex:0 0 56px}
  /* Stacked, because two buttons side by side won't fit a 56px column. */
  .frow.tworow.bulkrow{border-top:1px solid var(--hairline);padding-top:10px}
  .frow.tworow.bulkrow .cell{flex-direction:column;gap:4px}
  .frow.tworow.bulkrow button{color:var(--ink);font-size:12px;padding:2px 0;line-height:1.2}
  .toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s}
  .toggle.on i{transform:translateX(18px)}


  .rec{position:absolute;inset:0;background:var(--canvas);transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;z-index:7;min-height:0}
  .rec.open{transform:translateX(0)}
  .seg{display:flex;background:var(--canvas);border-radius:8px;padding:2px;margin:0}
  .seg button{flex:1;border:0;background:none;padding:8px 4px;font-size:13px;font-family:inherit;border-radius:6px;cursor:pointer;color:var(--slate)}
  .seg button.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .daypick{display:flex;gap:5px;padding:12px 14px}
  .daypick button{flex:1;aspect-ratio:1;border-radius:50%;border:0;background:var(--canvas);color:var(--slate);font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}
  .daypick button.on{background:var(--ink);color:#fff}
  .step{display:flex;align-items:center;gap:10px}
  .step button{width:30px;height:30px;border-radius:6px;border:1px solid var(--hairline);background:var(--paper);font-size:17px;cursor:pointer;color:var(--ink);font-family:inherit;line-height:1}
  .preview{font-size:14px}
  .preview div{padding:9px 14px;color:var(--slate)}
  .preview div+div{border-top:1px solid var(--hairline)}
  .preview div:first-child{color:var(--ink)}
  .hint{font-size:12px;color:var(--slate);padding:2px 6px 0}
  .drow{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
  .drow .caret{color:var(--slate);font-size:12px;transition:transform .18s;display:inline-block}
  .drow.open .caret{transform:rotate(90deg)}
  .dpick{padding:0 14px 12px;border-top:1px solid var(--hairline)}
  .quick{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px}
  .quick button{flex:0 0 auto;border:0;border-radius:99px;padding:7px 14px;font-size:14px;font-family:inherit;
    background:var(--canvas);color:var(--ink);cursor:pointer}
  .quick button.on{background:var(--ink);color:#fff}
  .dpick input{width:100%;border:1px solid var(--hairline);border-radius:8px;padding:10px;font:inherit;font-size:15px;color:var(--ink);background:var(--paper)}
  /* Confirmation sheet */
  .cscrim{position:absolute;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:20}
  .cscrim.open{opacity:1;pointer-events:auto}
  .cdlg{position:absolute;left:10px;right:10px;bottom:10px;z-index:21;
    transform:translateY(120%);transition:transform .26s cubic-bezier(.32,.72,0,1)}
  .cdlg.open{transform:translateY(0)}
  .cdlg .box{background:var(--paper);border-radius:14px;overflow:hidden;margin-bottom:8px}
  .cdlg .head{padding:16px 18px;text-align:center;border-bottom:1px solid var(--hairline)}
  .cdlg .head b{display:block;font-size:14px;margin-bottom:5px}
  .cdlg .head span{font-size:13px;color:var(--slate);line-height:1.4}
  .cdlg button{width:100%;border:0;background:var(--paper);padding:16px;font-size:17px;
    font-family:inherit;cursor:pointer}
  .cdlg .del{color:var(--overdue);font-weight:600}
  .cdlg .confirm{color:var(--ink);font-weight:600}
  .cdlg .cancel{border-radius:14px;font-weight:600;color:var(--ink)}
  .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px}
  .sw{aspect-ratio:1;border:0;border-radius:50%;cursor:pointer;color:#fff;font-size:14px;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-family:inherit}
  .sw.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
  /* Sized to match the other inline controls, and each option previews its own
     family so the list is legible as a font list rather than a word list. */
  /* text-align-last pulls the selected value across to sit beside the arrow —
     left-aligned in a fixed-width box it reads as a label with a stray chevron
     at the far end rather than as one control. The options themselves stay
     left-aligned so the open list is still scannable. */
  .fontpick{font:inherit;font-size:15px;border:1px solid var(--hairline);border-radius:8px;
    background:var(--canvas);color:var(--ink);padding:6px 8px 6px 12px;max-width:200px;
    font-family:inherit;text-align-last:right;cursor:pointer}
  .fontpick option{text-align:left;direction:ltr}
  /* Filled when forced on, faded when forced off, plain when following the
     category — so the third state is visible rather than implied. */
  .emphbtn{width:38px;height:30px;border:1px solid var(--hairline);border-radius:8px;
    background:var(--paper);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;padding:0}
  .emphbtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .emphbtn.off{opacity:.45;text-decoration:line-through}
  /* One row, scrolled rather than shrunk: ten controls at the 44pt minimum tap
     target need more width than the screen has. */
  .notebar{display:flex;gap:6px;align-items:center;overflow-x:auto;
    padding:8px 12px;border-top:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);background:var(--canvas);
    scrollbar-width:none}
  .notebar::-webkit-scrollbar{display:none}
  .notebar button{flex:0 0 auto;min-width:38px;height:34px;border:1px solid var(--hairline);
    border-radius:8px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;
    cursor:pointer;padding:0 8px;display:flex;align-items:center;justify-content:center}
  .notebar button:active{background:var(--hairline)}
  /* 12px rather than 13: "Default Color" and "Times New Roman" are the longest
     labels here, and the strip already scrolls — a smaller label keeps more of
     it on screen at once. */
  .notebar select{flex:0 0 auto;height:34px;border:1px solid var(--hairline);border-radius:8px;
    background:var(--paper);color:var(--ink);font:inherit;font-size:12px;padding:0 6px;
    max-width:132px;cursor:pointer}
  .noteedit{width:100%;min-height:120px;padding:12px 14px;font:inherit;font-size:14px;
    line-height:1.45;color:var(--ink);outline:none;overflow-y:auto;max-height:320px}
  .noteedit:empty:before{content:attr(data-placeholder);color:var(--slate)}
  .noteedit ul,.noteedit ol{margin:6px 0;padding-left:26px}
  .noteedit li{margin:2px 0}
  .noteedit p{margin:0 0 8px}
  .noteedit blockquote{margin:6px 0 6px 18px;padding-left:10px;border-left:2px solid var(--hairline)}
  .minicat{border:1px solid var(--hairline);background:var(--paper);color:var(--overdue);
    border-radius:99px;padding:4px 10px;font-size:12px;font-family:inherit;cursor:pointer}
  /* Scrolls horizontally: four pills don't fit a narrow phone, and wrapping
     them onto a second line would eat list space every time. */
  .tabs{display:flex;gap:8px;padding:10px 16px 12px;background:var(--paper);
    border-bottom:1px solid var(--hairline);
    overflow-x:auto;overflow-y:hidden;
    scrollbar-width:none;scroll-behavior:smooth;overscroll-behavior-x:contain}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;white-space:nowrap;
    display:flex;align-items:center;gap:7px;border:0;border-radius:99px;
    padding:8px 14px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;
    background:var(--canvas);color:var(--ink)}
  .tabs button.on{background:var(--ink);color:#fff}
  /* The fill is the category color, so selection reads as a ring instead. */
  .tabs button.cat.on{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink)}
  .tabs button.nocat{border:1px solid var(--hairline)}
  .tabs button.nocat.on{border-color:transparent}
  .tabs .bdg{font-size:12px;font-weight:600;padding:2px 6px;border-radius:99px;
    background:var(--hairline);color:var(--slate);font-variant-numeric:tabular-nums}
  .tabs button.on .bdg{background:rgba(255,255,255,.22);color:#fff}
  .movers{display:flex;gap:4px;flex:0 0 auto}
  .movers button{width:26px;height:26px;border:1px solid var(--hairline);background:var(--paper);
    border-radius:6px;font-size:10px;line-height:1;color:var(--ink);cursor:pointer;font-family:inherit}
  .movers button:disabled{opacity:.25;cursor:default}
  /* Narrower side margins than a list row: the bar is transient and reads
     better spanning most of the screen. */
  .undostack{position:absolute;left:8px;right:8px;bottom:20px;z-index:10;
    display:flex;flex-direction:column;gap:8px}
  .undobar{
    position:relative;
    background:var(--ink);border-radius:10px;padding:14px 16px 18px;
    display:flex;align-items:center;gap:14px;color:#fff;font-size:14px;
    opacity:0;transform:translateY(8px);pointer-events:none;transition:all .2s;
  }
  /* touch-action:none so the browser doesn't claim the vertical drag for
     scrolling before the handler sees it. */
  .undobar.show{opacity:1;transform:translateY(0);pointer-events:auto;
    touch-action:none;cursor:grab;user-select:none}
  .undobar.show:active{cursor:grabbing}
  .undobar .grip{width:28px;height:3px;border-radius:2px;background:rgba(255,255,255,.3);
    position:absolute;left:50%;margin-left:-14px;bottom:5px}
  .undobar button{margin-left:auto;background:none;border:0;color:#00A63E;
    font:600 14px inherit;font-family:inherit;cursor:pointer;padding:0}
  .toast{
    position:absolute;left:16px;right:16px;bottom:20px;background:var(--ink);color:#fff;
    border-radius:10px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(8px);
    transition:all .2s;pointer-events:none;z-index:9;
  }
  .toast.show{opacity:1;transform:translateY(0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="device">

  <!-- SIGN IN -->
  <div class="screen signin" id="signin">
    <div class="signin-inner">
    <div class="brand">
      <svg class="mark big" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13" cy="19" r="11" fill="#fff" stroke="#000" stroke-width="1.6"/>
        <path d="M7 19 L12 24.5 L28 4" fill="none" stroke="#00A63E" stroke-width="5.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Task Perfect</h1>
    </div>
    <p class="sub">Your Outlook tasks, on your phone</p>
    <div class="fieldgroup">
      <input id="u" placeholder="Username / e-mail" autocapitalize="none" autocorrect="off">
      <input id="p" placeholder="Password" type="password">
      <input id="srv" placeholder="Server" autocapitalize="none" autocorrect="off" class="hidden">
      <input id="dom" placeholder="Domain" autocorrect="off" class="hidden">
    </div>
    <!-- A button, not a label: Settings is behind this screen, so someone whose
         mailbox has moved would otherwise have no way to reach the field that
         fixes it. -->
    <button class="note linkish" id="toggleServer"></button>
    <button class="btn-primary" id="signinBtn" disabled>Sign in</button>
    <button class="demo" id="demoBtn">Explore with sample data</button>
    </div>
  </div>

  <!-- LOCKED -->
  <div class="screen signin hidden" id="locked">
    <div class="brand" style="flex-direction:column;gap:14px">
      <svg class="mark big" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="13" cy="19" r="11" fill="#fff" stroke="#000" stroke-width="1.6"/>
        <path d="M7 19 L12 24.5 L28 4" fill="none" stroke="#00A63E" stroke-width="5.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 style="font-size:26px">Task Perfect</h1>
    </div>
    <p class="sub">Locked</p>
    <button class="btn-primary" id="unlockBtn" style="max-width:280px">Unlock with Face ID</button>
    <button class="demo" id="usePasswordBtn">Use password instead</button>
  </div>

  <!-- LIST -->
  <div class="screen hidden" id="app">
    <div class="nav">
      <span class="navleft">
        <button id="filterBtn" title="Filter">☰</button>
        <button id="syncBtn" title="Sync now">↻</button>
      </span>
      <div class="title">
        <!-- The overflowing check is the point: one drawn wholly inside the disc
             reads as a generic "done" badge, while one that escapes reads as
             motion. overflow:visible keeps the long stroke from being clipped. -->
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="13" cy="19" r="11" fill="#fff" stroke="#000" stroke-width="1.6"/>
          <path d="M7 19 L12 24.5 L28 4" fill="none" stroke="#00A63E" stroke-width="5.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="titletext"><strong>Task Perfect</strong><span id="navsub"></span></span>
      </div>
      <button id="addBtn" title="Add task">＋</button>
    </div>
    <!-- The clear button is not decoration. Without it, emptying the field means
         selecting the text and deleting it, so a stale query stays put and the
         list reads as empty for no visible reason. -->
    <!-- The pill strip auto-centers the active tab, but a hand-scrolled strip
         can leave it off-screen — with fourteen pills, scrolling back to find it
         is a nuisance. Name only: a count here would have to agree with the
         pill badge in every case, including tabs whose badge is switched off. -->
    <div class="tabname" id="tabName"></div>
    <div class="searchwrap"><div class="searchfield">
      <input id="search" placeholder="Search All Tasks">
      <button id="clearSearch" class="hidden" title="Clear search" aria-label="Clear search">✕</button>
    </div></div>
    <div class="tabs" id="tabs"></div>

    <div class="popscrim" id="popscrim"></div>
    <div class="pop" id="pop"></div>
    <div class="list" id="list"></div>
    <div id="fatal" style="display:none;position:absolute;left:0;right:0;top:0;z-index:200;
      background:#7F1D1D;color:#fff;font:11px ui-monospace,Menlo,monospace;padding:6px 8px"></div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <div class="sheet-nav">
        <button id="cancelBtn">Cancel</button>
        <!-- Centered here rather than as a left-aligned section label, matching
             the Recurrence, Categories Filtering and Share Task panels. -->
        <strong id="sheetTitle" style="font-size:15px">Task</strong>
        <span style="display:flex;align-items:center;gap:16px">
          <!-- Only on a saved task: sharing something not yet written invites
               confusion about what was actually sent. Left of Save, which stays
               rightmost as the primary action. -->
          <button id="shareBtn" class="hidden" title="Share task"
            aria-label="Share task">⤴</button>
          <button class="save" id="saveBtn">Save</button>
        </span>
      </div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
    <div class="rec" id="rec">
      <div class="sheet-nav">
        <button id="recBack">‹ Back</button>
        <button class="save" id="recDone">Done</button>
      </div>
      <div class="sheet-body" id="recBody"></div>
    </div>
    <div class="rec" id="filters" style="z-index:9">
      <div class="sheet-nav"><button id="filtBack">‹ Back</button><strong style="font-size:15px">Categories Filtering</strong><button class="save" id="filtDone">Done</button></div>
      <div class="sheet-body" id="filtBody"></div>
    </div>
    <div class="rec" id="catsort" style="z-index:9">
      <div class="sheet-nav"><button id="sortBack">‹ Back</button><strong id="sortTitle" style="font-size:15px"></strong><button class="save" id="sortDone">Done</button></div>
      <div class="sheet-body" id="sortBody"></div>
    </div>
    <div class="rec" id="searchfields" style="z-index:9">
      <div class="sheet-nav"><button id="sfBack">‹ Back</button><button class="save" id="sfDone">Done</button></div>
      <div class="sheet-body" id="sfBody"></div>
    </div>
    <div class="rec" id="details" style="z-index:9">
      <div class="sheet-nav"><button id="detBack">‹ Back</button><button class="save" id="detDone">Done</button></div>
      <div class="sheet-body" id="detBody"></div>
    </div>
    <div class="rec" id="reminders" style="z-index:9">
      <div class="sheet-nav"><button id="remDismissAll">Dismiss all</button><button class="save" id="remDone">Done</button></div>
      <div class="sheet-body" id="remBody"></div>
    </div>
    <div class="rec" id="badges" style="z-index:9">
      <div class="sheet-nav"><button id="badgeBack">‹ Back</button><button class="save" id="badgeDone">Done</button></div>
      <div class="sheet-body" id="badgeBody"></div>
    </div>
    <div class="rec" id="settings">
      <div class="sheet-nav">
        <button id="setBack">‹ Back</button>
        <button class="save" id="setDone">Done</button>
      </div>
      <div class="sheet-body" id="setBody"></div>
    </div>
    <div class="rec" id="cats" style="z-index:8">
      <!-- The real app puts a + in the navigation bar, which never scrolls away.
           The prototype had only a row at the foot of the list, so on a long
           category list it read as buried when the app's won't be. -->
      <div class="sheet-nav"><button id="catBack">‹ Back</button>
        <button id="catAdd" title="Add category" aria-label="Add category"
          style="margin-left:auto;background:none;border:0;color:var(--navy);font-size:22px;line-height:1;padding:0 12px">+</button>
        <button class="save" id="catDone">Done</button></div>
      <div class="sheet-body" id="catBody"></div>
    </div>
    <div class="rec" id="catedit" style="z-index:9">
      <div class="sheet-nav"><button id="catEditBack">‹ Cancel</button><button class="save" id="catEditSave">Save</button></div>
      <div class="sheet-body" id="catEditBody"></div>
    </div>
    <div class="cscrim" id="cscrim"></div>
    <div class="cdlg" id="cdlg">
      <div class="box">
        <div class="head"><b id="cdlgTitle">Delete this task?</b><span id="cdlgMsg"></span></div>
        <button class="del" id="cdlgDel">Delete Task</button>
      </div>
      <div class="box"><button class="cancel" id="cdlgCancel">Cancel</button></div>
    </div>
    <!-- A desktop browser has no share sheet, so the prototype shows what would
         be sent instead of silently downloading a file and looking broken. -->
    <div class="rec" id="taskCats" style="z-index:11">
      <div class="sheet-nav"><button id="taskCatsBack">‹ Back</button>
        <strong style="font-size:15px">Categories</strong>
        <button class="save" id="taskCatsDone">Done</button></div>
      <div class="sheet-body" id="taskCatsBody"></div>
    </div>
    <div class="rec" id="sharePrev" style="z-index:11">
      <div class="sheet-nav"><button id="shareBack">‹ Back</button>
        <strong style="font-size:15px">Share Task</strong>
        <button class="save" id="shareDone">Done</button></div>
      <div class="sheet-body" id="sharePrevBody"></div>
    </div>
    <div class="undostack" id="undoStack"></div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
/* Wrapped whole. Under an opaque origin — a sandboxed frame without
   same-origin, which is how some in-app viewers load a local file — an
   uncaught exception reaches the console stripped of its message, file and
   line: every fault reads "Script error." A *caught* exception keeps all of
   it, so anything thrown while this file sets itself up is reported into the
   red bar with its real text. Costs nothing in a normal browser, where the
   catch never runs. */
try {

/* ---------- Outlook's 25 category colors (indices match EWS) ---------- */
/* Printed at the top of Settings, so a screenshot or a bug report identifies
   which build it came from. Update it when the delivered files change. */
const BUILD = "2026-08-17-1411";

const PALETTE = ["#E74C3C","#F39C12","#F8CBAD","#F1C40F","#2ECC71","#1ABC9C","#A9BD4F",
"#3498DB","#9B59B6","#C0392B","#95A5A6","#7F8C8D","#BDC3C7","#7B7B7B","#000000","#A93226",
"#CA6F1E","#D4A190","#B7950B","#1E8449","#148F77","#7D8C2E","#2471A3","#6C3483","#7B241C",
/* Beyond Outlook's 25 presets. A CATEGORY colored with one of these can't
   round-trip to the mailbox — the CategoryList blob only understands 0-24, so
   the category picker stays on presets and these are offered for FONT color,
   which never leaves the device. */
"#14396E","#1E90FF","#FF7A00","#D97706",
/* Deliberately more saturated than their Outlook counterparts — that extra
   chroma is what makes them read as different rather than as a slightly-off
   duplicate of a preset sitting a few swatches away. */
"#00D45E","#00693C","#D4A800","#7D8FA8","#3F4A5A","#E8197B","#00706A","#E03E00","#7A0038","#1550E0",
"#B3000F","#E01020","#5E6B00","#C41E4E","#FF2D2D","#8A5320","#9BB2E2","#B08C4A","#9B7A00"];

let CATEGORIES = [
  {name:"Special",colorIndex:8},{name:"Personal",colorIndex:1},
  {name:"LMC Projects",colorIndex:4},{name:"LMC Administration",colorIndex:7},
  {name:"LMC Misc",colorIndex:8},{name:"LMC Lawsuit",colorIndex:10},
  {name:"Friends",colorIndex:15},{name:"Investors",colorIndex:5}
];
const PALETTE_NAMES=["Red","Orange","Peach","Yellow","Green","Teal","Olive","Blue","Purple","Maroon",
"Steel","Dark Steel","Gray","Dark Gray","Black","Dark Red","Dark Orange","Dark Peach","Dark Yellow",
"Dark Green","Dark Teal","Dark Olive","Dark Blue","Dark Purple","Dark Maroon",
"Navy","Sky Blue","Bright Orange","Amber",
"Vivid Green","Forest","Deep Gold","Silver","Graphite","Vivid Pink","Pine","Burnt Orange","Burgundy","Cobalt",
"Crimson","Scarlet","Deep Olive","Rosewood","Cherry","Umber","Mist","Bronze","Mustard"];
/* Exchange can only store 0-24 on a category. */
const LAST_EXCHANGE_PRESET = 24;

/* Nearest preset by RGB distance — what Outlook falls back to when a category
   wears one of the four extended colors. */
function nearestPreset(i){
  const hex = PALETTE[i];
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  let best = 0, bestD = Infinity;
  for(let j=0;j<=LAST_EXCHANGE_PRESET;j++){
    const p = PALETTE[j];
    const dr=parseInt(p.slice(1,3),16)-r, dg=parseInt(p.slice(3,5),16)-g, db=parseInt(p.slice(5,7),16)-b;
    const d = dr*dr+dg*dg+db*db;

let CAT_ORDER = [];

/* Names not in the order — newly created, or renamed since — fall to the bottom
   A-Z rather than disappearing. */
function orderedCategories(){
  if(!CAT_ORDER.length) return CATEGORIES.slice();
  const rank = new Map(CAT_ORDER.map((n,i)=>[n,i]));
  return CATEGORIES.slice().sort((a,b)=>{
    const ra = rank.has(a.name) ? rank.get(a.name) : Infinity;
    const rb = rank.has(b.name) ? rank.get(b.name) : Infinity;
    if(ra !== rb) return ra - rb;
    return a.name.localeCompare(b.name, undefined, {sensitivity:"base"});
  });

function moveCategory(name, offset){

  const from = names.indexOf(name), to = from + offset;
  if(from < 0 || to < 0 || to >= names.length) return;
  [names[from], names[to]] = [names[to], names[from]];
  CAT_ORDER = names;
}

/* Stores the A-Z order explicitly rather than clearing it — clearing would fall
   back to the mailbox's own order, which isn't alphabetical and isn't what the

  if(keptText && keptText.trim()) parts.push(keptText.trim());

/* Each rung returns true/false to order the pair, or null meaning "can't
   separate these" — then the next level decides. A level only fires when every
   level above it ties, which is rarer than it looks. */
const LEVEL_FN = {
  none: () => null,
  dueSoonest: (a,b) => (a.due && b.due && +a.due !== +b.due) ? a.due < b.due
    : (!a.due && b.due) ? false : (a.due && !b.due) ? true : null,
  dueFurthest: (a,b) => (a.due && b.due && +a.due !== +b.due) ? a.due > b.due
    : (!a.due && b.due) ? false : (a.due && !b.due) ? true : null,
  az: (a,b) => { const c = a.subject.localeCompare(b.subject, undefined, {sensitivity:"base"});
    return c === 0 ? null : c < 0 },
  za: (a,b) => { const c = a.subject.localeCompare(b.subject, undefined, {sensitivity:"base"});
    return c === 0 ? null : c > 0 },
  // A yes/no split, not a sequence: one pile ahead of the other, ordering
  // within each pile left to the next level.
  highFirst: (a,b) => { const x = a.importance === "High", y = b.importance === "High";
    return x === y ? null : x },
  recurFirst: (a,b) => { const x = !!a.rec, y = !!b.rec; return x === y ? null : x },

  doneRecent: (a,b) => cmpDone(a, b, -1),
  doneOldest: (a,b) => cmpDone(a, b, +1),
  // Unassigned sinks in both directions, like undated tasks.
  assignedAZ: (a,b) => cmpAssigned(a, b, +1),
  assignedZA: (a,b) => cmpAssigned(a, b, -1),
  catAZ: (a,b) => cmpCategory(a, b, +1),
  catZA: (a,b) => cmpCategory(a, b, -1),
  catTab: (a,b) => {
    const x = homeCategory(a), y = homeCategory(b);
    if(!x || !y) return x === y ? null : !!x;      // untagged sinks
    const order = orderedCategories().map(c => c.name);
    const i = order.indexOf(x) < 0 ? Infinity : order.indexOf(x);
    const j = order.indexOf(y) < 0 ? Infinity : order.indexOf(y);
    // Categories outside the manual order fall to the end together; the next
    // level separates them.
    return i === j ? null : i < j;
  },
};

function cmpAssigned(a, b, dir){
  const x = assigneeOf(a), y = assigneeOf(b);
  if(x && y){
    const c = x.localeCompare(y, undefined, {sensitivity:"base"});
    return c === 0 ? null : (dir > 0 ? c < 0 : c > 0);
  }
  return (!x && !y) ? null : !!x;
}

/* Exchange doesn't always record a completion date — a task marked done by an
   older client can arrive without one. Those sink either direction. */
function cmpDone(a, b, dir){
  const x = a.completed, y = b.completed;
  if(x && y){ if(+x === +y) return null; return dir > 0 ? x < y : x > y }
  return (!x && !y) ? null : !!x;
}

/* A task's home category: its FIRST tag. Note first, not highest-ranked — a
   task tagged [Friends, Special] files under Friends even if Special sits
   earlier in the manual pill order. */
const homeCategory = t => t.categories[0] || null;

function cmpCategory(a, b, dir){
  const x = homeCategory(a), y = homeCategory(b);
  if(x && y){
    const c = x.localeCompare(y, undefined, {sensitivity:"base"});
    return c === 0 ? null : (dir > 0 ? c < 0 : c > 0);
  }
  return x === y ? null : !!x;                     // untagged sinks either way
}

function makeComparator(levels){
  return (a, b) => {
    for(const name of levels){
      const r = LEVEL_FN[name](a, b);
      if(r !== null) return r ? -1 : 1;
    }
    // Everything tied — fall back to subject so the order is stable between
    // renders rather than arbitrary.
    return a.subject.localeCompare(b.subject, undefined, {sensitivity:"base"});
  };
}
const categoryComparator = (a,b) => makeComparator(settings.catLevels)(a,b);
const mainComparator     = (a,b) => makeComparator(settings.mainLevels)(a,b);
const todayComparator    = (a,b) => makeComparator(settings.todayLevels)(a,b);
const overdueComparator  = (a,b) => makeComparator(settings.odLevels)(a,b);
const undatedComparator  = (a,b) => makeComparator(settings.ndLevels)(a,b);
const noCatComparator    = (a,b) => makeComparator(settings.ncLevels)(a,b);
const doneComparator     = (a,b) => makeComparator(settings.cpLevels)(a,b);
